<h1 id="%E4%B8%AD%E5%9B%BD%E6%95%B0%E6%8D%AE%E4%B8%AD%E5%BF%83%E5%9B%BD%E5%AE%B6%E6%88%98%E7%95%A5%E5%B8%83%E5%B1%80">中国数据中心：国家战略布局</h1>
<p><strong>《数据中心全景图谱（2026）》课堂扩展</strong></p>
<p>东数西算 · 八大枢纽 · 十大集群</p>
<p>施展 · 数据中心技术</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 960 720"><foreignObject width="960" height="720"><section id="2" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="2" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="18" data-size="4:3">
<h2 id="%E4%B8%BA%E4%BB%80%E4%B9%88%E8%AE%B2%E8%BF%99%E4%B8%80%E8%8A%82">为什么讲这一节</h2>
<p>数据中心不只是&quot;机房&quot;——它建在哪、由谁建、配多少电，背后是一张<strong>国家算力网络</strong>的顶层设计。</p>
<p>本节作为课程背景扩展，回答三个问题：</p>
<ul>
<li><strong>国家怎么布局</strong>：东数西算的 8 枢纽 / 10 集群</li>
<li><strong>企业怎么落子</strong>：阿里、腾讯、华为、运营商、IDC、金融</li>
<li><strong>技术怎么被牵引</strong>：选址、功率、散热、算电协同随之改变</li>
</ul>
<p><strong>素材</strong>：公众号「低碳之窗」《中国数据中心全景图谱（2026）》，243 个项目 / 82 个代表项目。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 960 720"><foreignObject width="960" height="720"><section data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="3" style="--paginate:true;--theme:gaia;--marpit-advanced-background-split:34%;" data-marpit-pagination-total="18" data-size="4:3" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;images/china-dc-8hubs-10clusters-map-2026.jpg&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="66%" height="720"><section id="3" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="3" style="--paginate:true;--theme:gaia;--marpit-advanced-background-split:34%;" data-marpit-pagination-total="18" data-size="4:3" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h2 id="%E4%B8%9C%E6%95%B0%E8%A5%BF%E7%AE%97%E5%9B%BD%E5%AE%B6%E7%AE%97%E5%8A%9B%E7%BD%91%E7%BB%9C%E7%9A%84%E9%AA%A8%E6%9E%B6">东数西算：国家算力网络的骨架</h2>

<p>2022 年工程全面启动。国家在八地布局<strong>算力枢纽</strong>，并在其中规划<strong>十个国家数据中心集群</strong>。</p>
<ul>
<li>为大型、超大型数据中心确定<strong>主要承载地区</strong></li>
<li>为<strong>跨区域算力协同</strong>提供组织框架</li>
<li>本质：把算力需求（东 / 南）与资源条件（西 / 北）在空间上重新匹配</li>
</ul>
</section>
</foreignObject><foreignObject width="960" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="3" style="" data-marpit-pagination-total="18" data-size="4:3" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 960 720"><foreignObject width="960" height="720"><section id="4" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="4" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="18" data-size="4:3">
<h2 id="%E4%B8%89%E5%B1%82%E5%B1%82%E7%BA%A7%E4%BB%8E%E5%9B%BD%E5%AE%B6%E6%88%98%E7%95%A5%E5%88%B0%E4%B8%80%E5%9D%97%E6%9C%BA%E6%88%BF">三层层级：从国家战略到一块机房</h2>
<p>阅读项目信息时常混用&quot;枢纽 / 集群 / 园区&quot;，它们其实是<strong>不同层级</strong>：</p>
<table>
<thead>
<tr>
<th>层级</th>
<th>含义</th>
<th>例子</th>
</tr>
</thead>
<tbody>
<tr>
<td>① 国家算力枢纽</td>
<td>区域算力承载节点</td>
<td>长三角枢纽（沪苏浙皖）</td>
</tr>
<tr>
<td>② 数据中心集群</td>
<td>枢纽内集中承载区，可跨行政区</td>
<td>示范区集群（青浦+吴江+嘉善）</td>
</tr>
<tr>
<td>③ 园区与项目</td>
<td>落到地块、机房及配套设施</td>
<td>各主体的具体项目</td>
</tr>
</tbody>
</table>
<p><strong>易混点</strong>：和林格尔集群起步区同时含<strong>呼和浩特</strong>和林格尔新区与<strong>乌兰察布</strong>集宁大数据产业园。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 960 720"><foreignObject width="960" height="720"><section id="5" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="18" data-size="4:3">
<h2 id="%E5%85%AB%E5%A4%A7%E6%9E%A2%E7%BA%BD-%E2%86%94-%E5%8D%81%E5%A4%A7%E9%9B%86%E7%BE%A4">八大枢纽 <img class="emoji" draggable="false" alt="↔" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2194.svg" data-marp-twemoji=""/> 十大集群</h2>
<p>长三角、成渝各有两个集群，其余六个各一个 → 8 枢纽对应 10 集群。</p>
<table>
<thead>
<tr>
<th>枢纽</th>
<th>国家集群</th>
<th>项目数</th>
<th>代表</th>
</tr>
</thead>
<tbody>
<tr>
<td>京津冀</td>
<td>张家口</td>
<td>50</td>
<td>12</td>
</tr>
<tr>
<td>长三角</td>
<td>示范区、芜湖</td>
<td>60</td>
<td>15</td>
</tr>
<tr>
<td>粤港澳</td>
<td>韶关</td>
<td>21</td>
<td>11</td>
</tr>
<tr>
<td>成渝</td>
<td>天府、重庆</td>
<td>18</td>
<td>10</td>
</tr>
<tr>
<td>内蒙古</td>
<td>和林格尔</td>
<td>44</td>
<td>10</td>
</tr>
<tr>
<td>贵州</td>
<td>贵安</td>
<td>22</td>
<td>9</td>
</tr>
<tr>
<td>甘肃</td>
<td>庆阳</td>
<td>11</td>
<td>7</td>
</tr>
<tr>
<td>宁夏</td>
<td>中卫</td>
<td>17</td>
<td>8</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 960 720"><foreignObject width="960" height="720"><section id="6" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="18" data-size="4:3">
<h2 id="%E9%80%89%E5%9D%80%E9%80%BB%E8%BE%91%E9%9C%80%E6%B1%82%E4%B8%8E%E8%B5%84%E6%BA%90%E5%8C%B9%E9%85%8D">选址逻辑：需求与资源匹配</h2>
<p>不同业务对选址的约束完全不同——这是理解布局的钥匙：</p>
<ul>
<li><strong>时延敏感</strong>（视频通话、实时交互）：重客户距离与网络连接</li>
<li><strong>空间型</strong>（存储备份、离线分析）：选址空间大，可放西部</li>
<li><strong>AI 训练</strong>：重集群规模与持续供电</li>
<li><strong>在线推理</strong>：兼顾响应时延与算力就近</li>
</ul>
<p>接入容量、供电可靠性、网络、冷却共同决定集群能长到多大。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 960 720"><foreignObject width="960" height="720"><section data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--theme:gaia;--marpit-advanced-background-split:40%;" data-marpit-pagination-total="18" data-size="4:3" data-marpit-advanced-background="background" data-marpit-advanced-background-split="left"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;images/dc-panorama-jingjinji-map.jpg&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="60%" height="720" x="40%"><section id="7" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--theme:gaia;--marpit-advanced-background-split:40%;" data-marpit-pagination-total="18" data-size="4:3" data-marpit-advanced-background="content" data-marpit-advanced-background-split="left">
<h2 id="%E4%BA%AC%E6%B4%A5%E5%86%80%E5%BC%A0%E5%AE%B6%E5%8F%A3--%E7%8E%AF%E9%A6%96%E9%83%BD">京津冀：张家口 + 环首都</h2>

<p>4 城 50 项目（张 30 / 廊 8 / 京 7 / 津 5）：</p>
<ul>
<li><strong>张家口</strong>：腾讯瑞北（30 万台）、宝之云（宣钢改造）、合盈（大模型训练）</li>
<li><strong>廊坊 / 北京</strong>：润泽信息港、光环新网；中金云网（金融）、首钢园（冬奥改造）</li>
<li><strong>天津</strong>：腾讯高新云、中国铁路主数据中心</li>
</ul>
<p><strong>特点</strong>：围绕首都需求分层布局。</p>
</section>
</foreignObject><foreignObject width="960" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="7" style="" data-marpit-pagination-total="18" data-size="4:3" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="left"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 960 720"><foreignObject width="960" height="720"><section data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--theme:gaia;--marpit-advanced-background-split:40%;" data-marpit-pagination-total="18" data-size="4:3" data-marpit-advanced-background="background" data-marpit-advanced-background-split="left"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;images/dc-panorama-yangtze-delta-map.jpg&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="60%" height="720" x="40%"><section id="8" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--theme:gaia;--marpit-advanced-background-split:40%;" data-marpit-pagination-total="18" data-size="4:3" data-marpit-advanced-background="content" data-marpit-advanced-background-split="left">
<h2 id="%E9%95%BF%E4%B8%89%E8%A7%92%E5%8F%8C%E9%9B%86%E7%BE%A4--%E5%A4%9A%E5%9F%8E%E5%B8%82">长三角：双集群 + 多城市</h2>

<p>13 城 60 项目，密度全国最高：</p>
<ul>
<li><strong>示范区</strong>（跨沪苏浙）：优刻得、吴江电信（1 万+ 高功率机架）、嘉善阿里（20 万台）</li>
<li><strong>芜湖</strong>：华为云华东（300 万台）、移动（40 kW 智算 + 7 kW 通算）</li>
<li><strong>上海</strong>：临港电信（万卡液冷）、松江腾讯（2.4 万柜）</li>
</ul>
<p><strong>特点</strong>：双集群 + 产业密集，多中心。</p>
</section>
</foreignObject><foreignObject width="960" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="8" style="" data-marpit-pagination-total="18" data-size="4:3" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="left"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 960 720"><foreignObject width="960" height="720"><section data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--theme:gaia;--marpit-advanced-background-split:40%;" data-marpit-pagination-total="18" data-size="4:3" data-marpit-advanced-background="background" data-marpit-advanced-background-split="left"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;images/dc-panorama-greater-bay-area-map.jpg&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="60%" height="720" x="40%"><section id="9" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--theme:gaia;--marpit-advanced-background-split:40%;" data-marpit-pagination-total="18" data-size="4:3" data-marpit-advanced-background="content" data-marpit-advanced-background-split="left">
<h2 id="%E7%B2%A4%E6%B8%AF%E6%BE%B3%E9%9F%B6%E5%85%B3%E6%89%BF%E8%BD%BD%E6%B9%BE%E5%8C%BA%E5%B0%B1%E8%BF%91">粤港澳：韶关承载，湾区就近</h2>

<h2 id="%E4%B8%89%E5%A4%A7%E8%B6%8B%E5%8A%BF%E5%B8%83%E5%B1%80%E5%9C%A8%E6%80%8E%E6%A0%B7%E5%8F%98%E5%8C%96">三大趋势：布局在怎样变化</h2>
<ol>
<li>
<p><strong>集中建设与城市服务长期并存</strong><br />
大型基地集中扩容，城市设施贴近客户；分工随时延、网络变化。</p>
</li>
<li>
<p><strong>智算扩张，首先改变机房的功率与散热</strong><br />
芜湖 40 kW 智算 vs 7 kW 通算同园区；成渝、内蒙高功率 + 液冷。同样千柜，供电制冷差很大——要看 <strong>IT 功率 + 单柜功率</strong>。</p>
</li>
<li>
<p><strong>能源条件进入项目整体方案</strong><br />
乌兰察布风光储、庆阳源网荷储、变电站液冷。资源优势转化为算力，落脚于<strong>算电协同</strong>。</p>
</li>
</ol>
</section>

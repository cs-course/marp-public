<h2 id="%E8%83%8C%E6%99%AF">背景</h2>

<p>NAND 闪存与 SSD 架构</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-marpit-scope-rKMqxWJG="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="5" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="%E5%AD%98%E5%82%A8%E4%BB%8B%E8%B4%A8%E6%BC%94%E8%BF%9B">存储介质演进</h3>

<table>
<thead>
<tr>
<th>介质</th>
<th>随机读延迟</th>
<th>接口</th>
<th>典型场景</th>
</tr>
</thead>
<tbody>
<tr>
<td>HDD</td>
<td>~10 ms</td>
<td>SATA/SAS</td>
<td>冷存储</td>
</tr>
<tr>
<td>SATA SSD</td>
<td>~150 μs</td>
<td>SATA</td>
<td>消费级</td>
</tr>
<tr>
<td>NVMe SSD</td>
<td>~100 μs</td>
<td>PCIe/NVMe</td>
<td>企业级</td>
</tr>
<tr>
<td>Optane</td>
<td>~10 μs</td>
<td>NVMe/DIMM</td>
<td>低延迟</td>
</tr>
<tr>
<td>AI SSD</td>
<td>~80 μs</td>
<td>NVMe/CXL</td>
<td>AI 训练/推理</td>
</tr>
</tbody>
</table>
<p>延迟从 10ms 降至 100μs——两个数量级的跨越</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-marpit-scope-dX0FxYS7="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="6" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="nand-%E9%97%AA%E5%AD%98%E5%9F%BA%E6%9C%AC%E5%8D%95%E5%85%83">NAND 闪存基本单元</h3>

<ul>
<li><strong>页</strong>：读/写的最小粒度（4KB ~ 16KB）</li>
<li><strong>块</strong>：擦除的最小粒度（128 ~ 512 页）</li>
<li><strong>不对称性</strong>：可以读/写任意页，但只能擦除整个块</li>
<li><strong>先擦后写</strong>：不能直接覆盖写——必须先擦除所在块</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-marpit-scope-VQrNxfzK="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="7" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="%E4%B8%89%E7%A7%8D%E6%93%8D%E4%BD%9C%E7%9A%84%E4%B8%8D%E5%AF%B9%E7%A7%B0">三种操作的不对称</h3>

<table>
<thead>
<tr>
<th>操作</th>
<th>延迟</th>
<th>粒度</th>
<th>说明</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>读</strong></td>
<td>~25 μs</td>
<td>页</td>
<td>随机读，直接寻址</td>
</tr>
<tr>
<td><strong>写</strong></td>
<td>~300 μs</td>
<td>页</td>
<td>编程页，不可覆盖写</td>
</tr>
<tr>
<td><strong>擦除</strong></td>
<td>~3 ms</td>
<td>块</td>
<td>必须整块擦除</td>
</tr>
</tbody>
</table>
<p>粒度不对称 + 延迟不对称 = 闪存管理的核心挑战</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-marpit-scope-OldTI1p1="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="8" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="%E5%86%99%E6%94%BE%E5%A4%A7waf">写放大（WAF）</h3>

<ul>
<li><strong>WAF</strong> = 闪存实际写入量 / 主机写入量</li>
<li><strong>原因</strong>：
<ul>
<li>GC 需要搬运有效数据（读 → 写 → 擦除）</li>
<li>OP 占用额外空间</li>
<li>映射表元数据更新</li>
</ul>
</li>
<li><strong>影响</strong>：WAF = 4 意味着写 1 字节消耗 4 字节闪存寿命</li>
<li><strong>目标</strong>：降低 WAF 是 SSD 设计的核心优化目标</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-marpit-scope-A3VSUSGG="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="9" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="%E5%9E%83%E5%9C%BE%E5%9B%9E%E6%94%B6gc">垃圾回收（GC）</h3>

<ul>
<li><strong>触发</strong>：空闲块不足时，后台回收无效页</li>
<li><strong>流程</strong>：
<ol>
<li>选择 victim 块（含最多无效页）</li>
<li>将有效页搬移到新块</li>
<li>擦除 victim 块</li>
</ol>
</li>
<li><strong>性能干扰</strong>：GC 搬移占用带宽和延迟——前台 I/O 被阻塞</li>
<li><strong>与 M2 关联</strong>：GC 突发是系统层性能干扰的重要来源</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-marpit-scope-Tla0nBvw="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="10" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="%E7%A3%A8%E6%8D%9F%E5%9D%87%E8%A1%A1wear-leveling">磨损均衡（Wear Leveling）</h3>

<ul>
<li><strong>目标</strong>：均衡各块的擦除次数，延长 SSD 寿命</li>
<li><strong>静态均衡</strong>：将冷数据搬移到高擦除次数的块</li>
<li><strong>动态均衡</strong>：新写入优先分配低擦除次数的块</li>
<li><strong>与 GC 协同</strong>：GC 选块时同时考虑无效页比例和擦除次数</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-marpit-scope-19X2w0lK="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="11" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="ftl-%E6%A6%82%E8%BF%B0">FTL 概述</h3>

<p><strong>闪存转换层（Flash Translation Layer）</strong> 核心职责：</p>
<ul>
<li><strong>地址映射</strong>：LBA → PBA</li>
<li><strong>垃圾回收</strong>：后台空间回收</li>
<li><strong>磨损均衡</strong>：擦除次数均衡</li>
<li><strong>坏块管理</strong>：标记并替换坏块</li>
</ul>
<p>FTL 是 SSD 固件的核心——本讲三挑战均围绕 FTL 展开</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-marpit-scope-PhiDpPmO="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="12" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="ssd-%E7%A1%AC%E4%BB%B6%E6%9E%B6%E6%9E%84">SSD 硬件架构</h3>

<ul>
<li><strong>控制器</strong>：FTL 引擎 + 多队列调度 + 加密/压缩</li>
<li><strong>DRAM 缓存</strong>：映射表 + 热数据缓冲</li>
<li><strong>NAND 阵列</strong>：多 Channel × 多 Chip × 多 Die × 多 Plane</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>┌─────────────────────────────────┐
│         SSD Controller          │
│  ┌───────────┐  ┌─────────────┐ │
│  │ FTL Engine │  │ DRAM Cache  │ │
│  └─────┬─────┘  └──────┬──────┘ │
│        │               │        │
│  ┌─────┴───────────────┴─────┐  │
│  │    Multi-Queue Scheduler  │  │
│  └──┬────┬────┬────┬────────┘  │
└─────┼────┼────┼────┼───────────┘
   CH0  CH1  CH2  CH3  (Channels)
   ▓▓   ▓▓   ▓▓   ▓▓   (NAND Chips)
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-marpit-scope-EqGNv7LH="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="13" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="%E5%B9%B6%E8%A1%8C%E6%80%A7%E5%B1%82%E7%BA%A7">并行性层级</h3>

<ul>
<li><strong>Channel</strong>：独立数据总线，可并行</li>
<li><strong>Chip</strong>（每 Channel 多个）：共享总线，分时复用</li>
<li><strong>Die</strong>（每 Chip 多个）：可独立执行命令</li>
<li><strong>Plane</strong>（每 Die 多个）：支持多平面操作</li>
</ul>
<p>并行度 = Channel × Chip × Die × Plane</p>
<p>高并行度 → 高吞吐，但也带来公平性挑战（挑战三）</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-marpit-scope-hZ6j9jD6="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="14" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="nvme-%E5%8D%8F%E8%AE%AE">NVMe 协议</h3>

<ul>
<li>从 SATA 到 NVMe：从单队列到 <strong>64K 队列 × 64K 深度</strong></li>
<li><strong>多队列</strong>：每 CPU 核心、每租户独立队列</li>
<li><strong>低延迟</strong>：绕过 SCSI 中间层，直接 PCIe 读写</li>
<li><strong>高并发</strong>：百万级 IOPS</li>
</ul>
<p>NVMe 多队列为多租户隔离提供了硬件基础——也引出了公平性挑战</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-marpit-scope-vnzCRL5P="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="15" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="%E5%A4%9A%E7%A7%9F%E6%88%B7-ssd">多租户 SSD</h3>

<ul>
<li><strong>SR-IOV</strong>：硬件级虚拟化，每 VM 独立物理功能</li>
<li><strong>vNVMe</strong>：软件模拟，灵活但开销大</li>
<li><strong>名称空间隔离</strong>：NVMe 原生支持，逻辑隔离</li>
<li><strong>问题</strong>：共享 NAND 阵列和 FTL——<strong>隔离不等于公平</strong></li>
</ul>
<p>引出三挑战：<strong>映射 / 缓存 / 公平性</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-marpit-scope-u3QY8PeX="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="16" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="%E5%B0%8F%E7%BB%93%E4%BB%8E%E4%BB%8B%E8%B4%A8%E7%89%B9%E6%80%A7%E5%88%B0%E6%9C%8D%E5%8A%A1%E8%B4%A8%E9%87%8F">小结：从介质特性到服务质量</h3>

<ul>
<li>NAND 的不对称性（读/写/擦除粒度与延迟不同）是一切挑战的根源</li>
<li>FTL 层面的三个核心挑战：
<ul>
<li><strong>映射</strong>：地址映射与空间管理</li>
<li><strong>缓存</strong>：替换策略的演进</li>
<li><strong>公平性</strong>：多租户 SSD 调度</li>
</ul>
</li>
<li>与 M2 的关联：设备层优化 <img class="emoji" draggable="false" alt="↔" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2194.svg" data-marp-twemoji=""/> 系统层 QoS 保障</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-marpit-scope-3ryoOQgV="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="17" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h2 id="%E6%8C%91%E6%88%98%E4%B8%80%E5%9C%B0%E5%9D%80%E6%98%A0%E5%B0%84%E4%B8%8E%E7%A9%BA%E9%97%B4%E7%AE%A1%E7%90%86">挑战一：地址映射与空间管理</h2>

<p>LBA → PBA 的映射与空间管理</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-marpit-scope-4USbmg48="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="18" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="%E5%9C%B0%E5%9D%80%E6%98%A0%E5%B0%84%E6%A6%82%E8%BF%B0">地址映射概述</h3>

<ul>
<li><strong>LBA</strong>（逻辑块地址）：主机视角的线性地址空间</li>
<li><strong>PBA</strong>（物理块地址）：NAND 上的实际物理位置</li>
<li><strong>FTL 映射表</strong>：LBA → PBA 的映射关系</li>
</ul>
<p><img src="images/direct-mapping.png" alt="" style="height:300px;" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-marpit-scope-bH5wfUwh="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="19" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="%E6%98%A0%E5%B0%84%E7%B2%92%E5%BA%A6">映射粒度</h3>

<table>
<thead>
<tr>
<th>策略</th>
<th>粒度</th>
<th>映射表大小</th>
<th>优势</th>
<th>劣势</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>页级映射</strong></td>
<td>页（4KB）</td>
<td>大</td>
<td>精度高，灵活</td>
<td>DRAM 占用大</td>
</tr>
<tr>
<td><strong>块级映射</strong></td>
<td>块（512KB）</td>
<td>小</td>
<td>DRAM 节省</td>
<td>粒度粗，碎片多</td>
</tr>
<tr>
<td><strong>混合映射</strong></td>
<td>页+块</td>
<td>中</td>
<td>兼顾</td>
<td>实现复杂</td>
</tr>
</tbody>
</table>
<p>1TB SSD 页级映射需 ~4GB DRAM——映射表开销不可忽视</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-marpit-scope-nvfz7iAK="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="20" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="%E6%98%A0%E5%B0%84%E8%A1%A8%E5%BC%80%E9%94%80">映射表开销</h3>

<ul>
<li>每页映射项 = 8 字节（LBA + PBA）</li>
<li>1TB SSD = 2.68 亿页 × 8B ≈ <strong>2GB DRAM</strong></li>
<li>加上元数据 → <strong>~4GB DRAM</strong></li>
<li>企业级 SSD 通常 4~8GB DRAM——映射表占大头</li>
<li><strong>优化方向</strong>：压缩映射表 / 分级映射 / 映射表缓存</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-marpit-scope-EIXkDvpx="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="21" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="%E7%A9%BA%E9%97%B4%E7%AE%A1%E7%90%86%E8%BF%87%E5%BA%A6%E4%BE%9B%E7%BB%99op">空间管理：过度供给（OP）</h3>

<ul>
<li><strong>OP</strong> = 物理容量 - 用户可用容量</li>
<li>240GB SSD 实际 256GB NAND → 7% OP</li>
<li><strong>OP 的作用</strong>：
<ul>
<li>降低 WAF（更多可用块 → GC 压力小）</li>
<li>提供写入缓冲（减少前台阻塞）</li>
<li>延长寿命（分散擦除）</li>
</ul>
</li>
<li><strong>代价</strong>：用户可用容量减少</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-marpit-scope-aVKFhwzl="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="22" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="%E5%B9%B6%E8%A1%8C%E6%84%9F%E7%9F%A5%E5%88%86%E9%85%8D">并行感知分配</h3>

<ul>
<li>地址如何分布到 Channel / Chip / Die → 决定并行度上限</li>
<li><strong>目标</strong>：连续 LBA 尽量分散到不同 Channel → 读写并行</li>
<li><strong>冲突</strong>：如果热点 LBA 集中在同一 Channel → 带宽瓶颈</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>LBA 0  → CH0, Die0    LBA 4  → CH0, Die1
LBA 1  → CH1, Die0    LBA 5  → CH1, Die1
LBA 2  → CH2, Die0    LBA 6  → CH2, Die1
LBA 3  → CH3, Die0    LBA 7  → CH3, Die1
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-marpit-scope-BrUouibZ="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="23" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="%E9%9D%99%E6%80%81%E5%88%86%E9%85%8D%E7%AD%96%E7%95%A5">静态分配策略</h3>

<ul>
<li><strong>Round-Robin</strong>：LBA 按顺序轮流分配到各 Channel/Chip</li>
<li><strong>优势</strong>：简单、均匀</li>
<li><strong>劣势</strong>：不感知访问模式
<ul>
<li>热点数据可能集中在同一 Channel</li>
<li>导致部分 Channel 过载，其他空闲</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-marpit-scope-1fQNFq63="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="24" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="%E9%9D%99%E6%80%81%E5%88%86%E9%85%8D%E7%9A%84%E5%B1%80%E9%99%90">静态分配的局限</h3>

<ul>
<li><strong>热点集中</strong>：部分 Channel 过载 → 延迟上升</li>
<li><strong>磨损不均</strong>：频繁写入的块集中在少数 Die → 寿命缩短</li>
<li><strong>并行度浪费</strong>：虽然分配均匀，但访问不均匀 → 有效并行度低</li>
<li><strong>核心问题</strong>：静态策略无法适应动态访问模式</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-marpit-scope-vZaLkqlV="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="25" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="%E5%8A%A8%E6%80%81%E5%88%86%E9%85%8D%E7%AD%96%E7%95%A5">动态分配策略</h3>

<ul>
<li><strong>运行时重映射</strong>：根据访问模式动态调整 LBA → PBA 映射</li>
<li><strong>优势</strong>：可适应负载变化</li>
<li><strong>代价</strong>：
<ul>
<li>映射表频繁更新</li>
<li>数据搬移产生 GC 干扰</li>
<li>元数据一致性保证复杂</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-marpit-scope-x693NJT5="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="26" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="%E5%8A%A8%E6%80%81%E5%88%86%E9%85%8D%E7%9A%84%E4%BB%A3%E4%BB%B7">动态分配的代价</h3>

<ul>
<li><strong>写放大加剧</strong>：重映射 = 额外的数据搬移</li>
<li><strong>延迟抖动</strong>：重映射期间前台 I/O 被阻塞</li>
<li><strong>一致性风险</strong>：映射表更新与数据搬移的原子性</li>
<li><strong>核心矛盾</strong>：动态性好 → 开销大；开销小 → 动态性差</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-marpit-scope-3VvlmrsD="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="27" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="%E9%A2%84%E6%B5%8B%E7%9A%84%E5%BC%95%E5%85%A5">预测的引入</h3>

<ul>
<li><strong>思路</strong>：用访问模式预测优化静态分配
<ul>
<li>保留静态分配的低开销</li>
<li>获得接近动态分配的适应性</li>
</ul>
</li>
<li><strong>方法</strong>：
<ul>
<li>分析历史访问模式 → 识别热点</li>
<li>预测未来访问 → 预分配并行度</li>
<li>静态增强：在初始分配时考虑预测信息</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-marpit-scope-WELm6eP0="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="28" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="%E6%88%91%E4%BB%AC%E7%9A%84%E5%B7%A5%E4%BD%9Cssd-address-allocation-2024">我们的工作：SSD Address Allocation (2024)</h3>

<ul>
<li><strong>增强静态策略</strong>：利用访问模式信息优化地址分配决策</li>
<li><strong>核心创新</strong>：
<ul>
<li>访问模式分析 → 热点识别</li>
<li>并行度感知的分配增强</li>
<li>在不引入运行时重映射开销的前提下提升并行度</li>
</ul>
</li>
<li><strong>与 M2 关联</strong>：设备层地址映射优化 <img class="emoji" draggable="false" alt="↔" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2194.svg" data-marp-twemoji=""/> M2 系统层数据分布</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-marpit-scope-dDkFJXxU="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="29" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="%E6%96%B9%E6%B3%95%E8%AF%A6%E8%A7%A3">方法详解</h3>

<ul>
<li><strong>Step 1</strong>：访问模式分析
<ul>
<li>统计 LBA 访问频率与空间分布</li>
<li>识别热点区域与冷区域</li>
</ul>
</li>
<li><strong>Step 2</strong>：热点识别
<ul>
<li>基于频率阈值的自适应热点检测</li>
<li>热点 LBA 标记为&quot;高优先级并行分配&quot;</li>
</ul>
</li>
<li><strong>Step 3</strong>：并行度感知分配增强
<ul>
<li>热点 LBA 强制分散到不同 Channel</li>
<li>冷数据沿用 Round-Robin</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-marpit-scope-iI2TK2eD="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="30" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="%E5%AE%9E%E9%AA%8C%E7%BB%93%E6%9E%9C">实验结果</h3>

<ul>
<li><strong>并行度利用率</strong>提升 15-30%</li>
<li><strong>吞吐</strong>改善 20%（顺序+混合负载）</li>
<li><strong>WAF</strong>降低 8-12%（减少热点集中导致的额外 GC）</li>
<li><strong>尾延迟</strong>P99 改善 18%</li>
<li><strong>零运行时开销</strong>：无重映射，无额外数据搬移</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-marpit-scope-d0mhqrDM="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="31" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="%E4%B8%8E-m2-%E7%9A%84%E5%85%B3%E8%81%94">与 M2 的关联</h3>

<p><strong>设备层</strong>（M3）：地址映射优化——预测访问模式 → 分散热点到多 Channel</p>
<p><img class="emoji" draggable="false" alt="↕" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2195.svg" data-marp-twemoji=""/></p>
<p><strong>系统层</strong>（M2）：数据分布与负载均衡——预测负载 → 合理分配存储资源</p>
<p>两层优化服务于同一目标：<strong>提升存储系统的并行度与 QoS</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-marpit-scope-N3tXvDb3="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="32" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="%E5%B0%8F%E7%BB%93%E6%98%A0%E5%B0%84%E4%BC%98%E5%8C%96">小结：映射优化</h3>

<ul>
<li>地址映射的核心是&quot;<strong>预测访问模式</strong>&quot;</li>
<li>从静态到自适应：用预测信息增强静态策略</li>
<li>零开销获得动态策略的部分优势</li>
<li>设备层映射优化是系统层 QoS 保障的基础</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-marpit-scope-wR7a6Dam="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="33" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h2 id="%E6%8C%91%E6%88%98%E4%BA%8C%E7%BC%93%E5%AD%98%E6%9B%BF%E6%8D%A2%E7%AD%96%E7%95%A5">挑战二：缓存替换策略</h2>

<p>从规则驱动到学习驱动</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-marpit-scope-h6H0A2LG="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="34" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="%E6%89%BF%E6%8E%A5%E4%BB%8E%E5%BC%95%E5%AD%90%E5%88%B0%E5%B1%95%E5%BC%80">承接：从引子到展开</h3>

<p>本节的核心工作（ICCD'22 多因子协作替换）曾在《对象存储》<strong>挑战三</strong>末尾作为一句话引子出现：</p>
<ul>
<li>那里给出的结论是：<strong>缓存命中率可预测 → 替换决策可优化</strong></li>
<li>本节回答<strong>为什么可预测</strong>、<strong>预测什么因子</strong>、<strong>如何在两级缓存间协作</strong></li>
</ul>
<p>同一个结论，在<strong>机制层</strong>展开成完整的设计与验证</p>
<blockquote>
<p>引子出处：《对象存储》挑战三「更多的问题——用预测提高缓存算法效率」</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-marpit-scope-fOL0vcdw="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="35" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="ssd-%E7%BC%93%E5%AD%98%E6%9E%B6%E6%9E%84">SSD 缓存架构</h3>

<p><img src="images/cache-memory-storage.png" alt="" style="height:350px;" /></p>
<ul>
<li><strong>DRAM 缓冲区</strong>：热数据，纳秒级访问</li>
<li><strong>NAND 缓存层</strong>（部分 SSD）：温数据，微秒级</li>
<li>两级结构：DRAM → NAND → 后端存储</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-marpit-scope-JAFikUPE="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="36" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="%E4%B8%BA%E4%BB%80%E4%B9%88%E7%BC%93%E5%AD%98%E5%AF%B9-ssd-%E8%87%B3%E5%85%B3%E9%87%8D%E8%A6%81">为什么缓存对 SSD 至关重要</h3>

<ul>
<li><strong>降低 WAF</strong>：命中缓存 → 减少写入 NAND</li>
<li><strong>提升读命中</strong>：热数据在 DRAM → 降低读延迟</li>
<li><strong>削峰填谷</strong>：缓存吸收突发写入 → 平滑 GC 压力</li>
<li><strong>替换策略</strong>：决定缓存命中率——直接影响性能</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-marpit-scope-6s5M7v18="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="37" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="%E7%BB%8F%E5%85%B8%E7%AD%96%E7%95%A5lru">经典策略：LRU</h3>

<p><img src="images/cache-working-flow.png" alt="" style="height:300px;" /></p>
<ul>
<li><strong>最近最少使用</strong>（Least Recently Used）</li>
<li><strong>假设</strong>：时间局部性——最近访问的数据 likely 再次访问</li>
<li><strong>优势</strong>：实现简单，对时序局部性负载效果好</li>
<li><strong>劣势</strong>：扫描负载下命中率骤降</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-marpit-scope-XO6kk5cI="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="38" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="%E7%BB%8F%E5%85%B8%E7%AD%96%E7%95%A5fifo--random">经典策略：FIFO / Random</h3>

<ul>
<li><strong>FIFO</strong>（先进先出）：按入队顺序替换
<ul>
<li>优势：实现最简单</li>
<li>劣势：完全不考虑访问模式</li>
</ul>
</li>
<li><strong>Random</strong>：随机选择替换目标
<ul>
<li>优势：零元数据开销</li>
<li>劣势：命中率不稳定，但均摊性能可接受</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-marpit-scope-1XCmJ091="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="39" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="%E8%BF%9B%E9%98%B6%E7%AD%96%E7%95%A5arc--lirs">进阶策略：ARC / LIRS</h3>

<ul>
<li><strong>ARC</strong>（Adaptive Replacement Cache）：
<ul>
<li>同时维护 LRU 和 LFU 两个队列</li>
<li>自适应调整两个队列的比例</li>
</ul>
</li>
<li><strong>LIRS</strong>：
<ul>
<li>基于访问间隔的栈算法</li>
<li>区分高频和低频访问</li>
</ul>
</li>
<li><strong>共同特点</strong>：综合考虑频率 + 时间局部性</li>
<li><strong>局限</strong>：为通用场景设计，不感知 SSD 特有代价（如写入代价）</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-marpit-scope-Sk13Nii9="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="40" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="%E5%A4%9A%E7%BA%A7%E5%8D%8F%E4%BD%9C">多级协作</h3>

<ul>
<li><strong>DRAM <img class="emoji" draggable="false" alt="↔" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2194.svg" data-marp-twemoji=""/> NAND 协同</strong>：
<ul>
<li>热数据晋升：DRAM 命中多次 → 标记为热</li>
<li>冷数据降级：DRAM 长时间未命中 → 降级到 NAND</li>
</ul>
</li>
<li><strong>跨层级替换</strong>：NAND 缓存满 → 驱逐到后端存储</li>
<li><strong>挑战</strong>：跨层级决策需要综合考虑访问频率与迁移代价</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-marpit-scope-51iJkLOg="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="41" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="%E7%BC%93%E5%AD%98%E6%9B%BF%E6%8D%A2%E7%9A%84%E9%A2%84%E6%B5%8B%E7%BB%B4%E5%BA%A6">缓存替换的预测维度</h3>

<p>传统策略只考虑 1-2 个维度。SSD 缓存替换需要综合考虑：</p>
<ul>
<li><strong>访问频率</strong>：多久被访问一次？</li>
<li><strong>时间局部性</strong>：最近多久被访问？</li>
<li><strong>空间局部性</strong>：相邻数据是否一起访问？</li>
<li><strong>写入代价</strong>：替换该块会引发多少 GC？</li>
</ul>
<p>→ 多维度综合决策 = <strong>预测问题</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-marpit-scope-wkiqkd9f="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="42" style="--paginate:true;--theme:gaia;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="89" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;images/iccd22-bg1.png&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="42" data-marpit-scope-wkiqkd9f="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="42" style="--paginate:true;--theme:gaia;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="89" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="%E6%88%91%E4%BB%AC%E7%9A%84%E5%B7%A5%E4%BD%9C%E4%B8%80multi-factor-cache-replacement-iccd22">我们的工作一：Multi-Factor Cache Replacement (ICCD'22)</h3>

<ul>
<li><a href="https://ieeexplore.ieee.org/document/9978474">A Multi-Factor Adaptive Multi-Level Cooperative Replacement Policy</a>, ICCD 2022</li>
<li><strong>核心思想</strong>：多因子自适应多级协作替换</li>
<li><strong>贡献</strong>：
<ul>
<li>综合多维度信号的加权决策</li>
<li>DRAM <img class="emoji" draggable="false" alt="↔" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2194.svg" data-marp-twemoji=""/> NAND 跨层级协同替换</li>
<li>自适应权重调整</li>
</ul>
</li>
</ul>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-marpit-scope-wkiqkd9f="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="42" style="" data-marpit-pagination-total="89" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-marpit-scope-bvDLdaZz="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="43" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="%E5%A4%9A%E5%9B%A0%E5%AD%90%E6%96%B9%E6%B3%95%E8%AF%A6%E8%A7%A3">多因子方法详解</h3>

<p><img src="images/iccd22-bg2.png" alt="" style="width:900px;" /></p>

<h3 id="%E5%A4%9A%E7%BA%A7%E5%8D%8F%E4%BD%9C%E6%9C%BA%E5%88%B6">多级协作机制</h3>

<p><img src="images/iccd22-bg3.png" alt="" style="width:900px;" /></p>
<p>DRAM 层替换 → 考虑是否晋升/降级到 NAND 层 → NAND 层替换 → 驱逐到后端</p>
<p><img src="images/iccd22-bg4.png" alt="" style="width:900px;" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-marpit-scope-K5x35h8k="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="45" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="%E5%AE%9E%E9%AA%8C%E7%BB%93%E6%9E%9C-1">实验结果</h3>

<ul>
<li><strong>命中率</strong>提升 12-25%（对比 LRU）</li>
<li><strong>WAF</strong>降低 10-15%（减少不必要的写入）</li>
<li><strong>尾延迟</strong>P99 改善 20%</li>
<li>自适应权重在不同负载下均表现稳定</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-marpit-scope-X4BABfeI="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="46" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="%E6%88%91%E4%BB%AC%E7%9A%84%E5%B7%A5%E4%BD%9C%E4%BA%8Cdrl-cache-replacement-2022">我们的工作二：DRL Cache Replacement (2022)</h3>

<ul>
<li>基于深度强化学习的端到端自动缓存替换</li>
<li><strong>核心思想</strong>：将缓存替换建模为 MDP
<ul>
<li><strong>状态</strong>：缓存内容向量 + 访问历史</li>
<li><strong>动作</strong>：选择替换目标</li>
<li><strong>奖励</strong>：命中率（或负的替换代价）</li>
</ul>
</li>
<li><strong>优势</strong>：端到端学习，无需手动设计权重</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-marpit-scope-kabBsrQz="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="47" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="drl-%E6%96%B9%E6%B3%95%E8%AF%A6%E8%A7%A3">DRL 方法详解</h3>

<ul>
<li><strong>状态编码</strong>：每个缓存块的访问频率、时间戳、大小 → 状态向量</li>
<li><strong>动作空间</strong>：选择一个缓存块进行替换</li>
<li><strong>奖励函数</strong>：命中 = +1，未命中 = 0（或考虑写入代价）</li>
<li><strong>训练</strong>：DQN / PPO 在模拟环境中训练</li>
<li><strong>部署</strong>：训练好的模型在线推理，微秒级决策</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-marpit-scope-fiBzp84s="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="48" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">

<ul>

</ul>
<p>另一条线索来自《性能预测技术与服务质量保障》：那一讲在<strong>系统层</strong>用错误预算分配 SLO，本节在<strong>设备层</strong>用协作组重分并行度——两层各管一段</p>

<p>引子出处：《对象存储》挑战三「用预测协调缓存和调度公平性」</p>

<h3 id="%E5%A4%9A%E7%A7%9F%E6%88%B7-ssd-%E5%9C%BA%E6%99%AF">多租户 SSD 场景</h3>

<ul>
<li>云存储中 NVMe SSD 被多租户共享</li>
<li>多租户 I/O 混合调度——每个租户有独立 NVMe 队列</li>
<li><strong>问题</strong>：队列隔离 ≠ 性能隔离
<ul>
<li>GC 突发影响所有租户</li>
<li>写入争用导致读延迟飙升</li>
<li>大 I/O 阻塞小 I/O</li>
</ul>
</li>
</ul>
</section>

<h3 id="%E5%85%AC%E5%B9%B3%E6%80%A7%E5%BA%A6%E9%87%8F">公平性度量</h3>

<ul>
<li><strong>Jain 公平指数</strong>：<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mtext>Fairness</mtext><mo>=</mo><mfrac><mrow><mo stretchy="false">(</mo><msub><mo>∑</mo><mi>i</mi></msub><msub><mi>x</mi><mi>i</mi></msub><msup><mo stretchy="false">)</mo><mn>2</mn></msup></mrow><mrow><mi>n</mi><msub><mo>∑</mo><mi>i</mi></msub><msubsup><mi>x</mi><mi>i</mi><mn>2</mn></msubsup></mrow></mfrac></mrow><annotation encoding="application/x-tex">\text{Fairness} = \frac{(\sum_i x_i)^2}{n \sum_i x_i^2}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord text"><span class="mord">Fairness</span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1.7581em;vertical-align:-0.5992em;"></span><span class="mord"><span class="mopen nulldelimiter"></span><span class="mfrac"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1.1589em;"><span style="top:-2.6264em;"><span class="pstrut" style="height:3em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">n</span><span class="mspace mtight" style="margin-right:0.1952em;"></span><span class="mop mtight"><span class="mop op-symbol small-op mtight" style="position:relative;top:0em;">∑</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1496em;"><span style="top:-2.1786em;margin-left:0em;margin-right:0.0714em;"><span class="pstrut" style="height:2.5em;"></span><span class="sizing reset-size3 size1 mtight"><span class="mord mathnormal mtight">i</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.3214em;"><span></span></span></span></span></span></span><span class="mspace mtight" style="margin-right:0.1952em;"></span><span class="mord mtight"><span class="mord mathnormal mtight">x</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.8051em;"><span style="top:-2.1777em;margin-left:0em;margin-right:0.0714em;"><span class="pstrut" style="height:2.5em;"></span><span class="sizing reset-size3 size1 mtight"><span class="mord mathnormal mtight">i</span></span></span><span style="top:-2.8448em;margin-right:0.0714em;"><span class="pstrut" style="height:2.5em;"></span><span class="sizing reset-size3 size1 mtight"><span class="mord mtight">2</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.3223em;"><span></span></span></span></span></span></span></span></span></span><span style="top:-3.23em;"><span class="pstrut" style="height:3em;"></span><span class="frac-line" style="border-bottom-width:0.04em;"></span></span><span style="top:-3.535em;"><span class="pstrut" style="height:3em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mopen mtight">(</span><span class="mop mtight"><span class="mop op-symbol small-op mtight" style="position:relative;top:0em;">∑</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1496em;"><span style="top:-2.1786em;margin-left:0em;margin-right:0.0714em;"><span class="pstrut" style="height:2.5em;"></span><span class="sizing reset-size3 size1 mtight"><span class="mord mathnormal mtight">i</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.3214em;"><span></span></span></span></span></span></span><span class="mspace mtight" style="margin-right:0.1952em;"></span><span class="mord mtight"><span class="mord mathnormal mtight">x</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3281em;"><span style="top:-2.357em;margin-left:0em;margin-right:0.0714em;"><span class="pstrut" style="height:2.5em;"></span><span class="sizing reset-size3 size1 mtight"><span class="mord mathnormal mtight">i</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.143em;"><span></span></span></span></span></span></span><span class="mclose mtight"><span class="mclose mtight">)</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8913em;"><span style="top:-2.931em;margin-right:0.0714em;"><span class="pstrut" style="height:2.5em;"></span><span class="sizing reset-size3 size1 mtight"><span class="mord mtight">2</span></span></span></span></span></span></span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.5992em;"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span></span></span></span></li>
<li><strong>SLO 合规率</strong>：满足 SLO 的请求比例</li>
<li><strong>尾延迟公平性</strong>：各租户 P99 延迟的方差</li>
<li><strong>公平 ≠ 均等</strong>：按权重分配资源，保证各租户 SLO 达标</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-marpit-scope-yx2XuEMH="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="54" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="%E5%B9%B6%E8%A1%8C%E6%80%A7%E4%B8%8E%E5%85%AC%E5%B9%B3%E6%80%A7%E7%9A%84%E7%9F%9B%E7%9B%BE">并行性与公平性的矛盾</h3>

<ul>
<li><strong>高并行度</strong> → 总吞吐高，但：
<ul>
<li>热点租户独占 Channel → 其他租户饿死</li>
<li>GC 在高并行下更激进 → 干扰更大</li>
</ul>
</li>
<li><strong>严格公平</strong> → 各租户隔离，但：
<ul>
<li>并行度利用率低</li>
<li>总吞吐下降</li>
</ul>
</li>
<li><strong>核心矛盾</strong>：并行性与公平性需要权衡</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-marpit-scope-aPRbYzAl="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="55" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="%E5%B9%B2%E6%89%B0%E6%9D%A5%E6%BA%90">干扰来源</h3>

<ul>
<li><strong>GC 突发</strong>：后台 GC 集中执行 → 前台 I/O 阻塞</li>
<li><strong>写入争用</strong>：多租户同时写入 → 擦除冲突</li>
<li><strong>队列阻塞</strong>：大 I/O 占用队列 → 小 I/O 排队等待</li>
<li><strong>与 M2 关联</strong>：设备层干扰来源 <img class="emoji" draggable="false" alt="↔" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2194.svg" data-marp-twemoji=""/> M2 系统层性能干扰</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-marpit-scope-76TMiWPB="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="56" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="%E6%88%91%E4%BB%AC%E7%9A%84%E5%B7%A5%E4%BD%9C%E4%B8%80parallelism-vs-fairness-2024">我们的工作一：Parallelism vs Fairness (2024)</h3>

<ul>
<li>分析 SSD 并行度利用与公平性的权衡关系</li>
<li><strong>核心问题</strong>：在保证公平性的前提下，并行度能利用到什么程度？</li>
<li><strong>方法</strong>：
<ul>
<li>并行度建模：量化 Channel/Chip 利用率</li>
<li>公平性约束：Jain 指数 ≥ 阈值</li>
<li>权衡最优解：帕累托前沿</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-marpit-scope-mRW3Zxs6="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="57" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="%E6%96%B9%E6%B3%95%E8%AF%A6%E8%A7%A3-1">方法详解</h3>

<ul>
<li><strong>并行度建模</strong>：
<ul>
<li>有效并行度 = 实际并行使用的 Channel 数</li>
<li>利用率 = 有效并行度 / 最大并行度</li>
</ul>
</li>
<li><strong>公平性约束</strong>：
<ul>
<li>每个租户的 IOPS 满足 SLO</li>
<li>尾延迟公平性约束</li>
</ul>
</li>
<li><strong>权衡求解</strong>：
<ul>
<li>帕累托最优：无法同时提升并行度和公平性</li>
<li>根据负载特征选择帕累托前沿上的最优点</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-marpit-scope-2ZluwZME="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="58" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="%E5%AE%9E%E9%AA%8C%E7%BB%93%E6%9E%9C-2">实验结果</h3>

<ul>
<li>不同负载下绘制公平性-并行度帕累托前沿</li>
<li>顺序负载：并行度可达 90% 同时保持公平性 &gt; 0.9</li>
<li>随机负载：需牺牲 20% 并行度换取公平性 &gt; 0.85</li>
<li>混合负载：自适应选择前沿上的最优点</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-marpit-scope-rL7euxVp="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="59" style="--paginate:true;--theme:gaia;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="89" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;images/dac23-bg1.png&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="59" data-marpit-scope-rL7euxVp="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="59" style="--paginate:true;--theme:gaia;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="89" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="%E6%88%91%E4%BB%AC%E7%9A%84%E5%B7%A5%E4%BD%9C%E4%BA%8Cfair-will-go-on-dac23">我们的工作二：Fair Will Go On (DAC'23)</h3>

<ul>
<li><a href="https://ieeexplore.ieee.org/document/10247718">Fair Will Go On: A Collaboration-Aware Fairness Scheme</a>, DAC 2023</li>
<li><strong>核心观察</strong>：多租户间存在协作机会
<ul>
<li>租户 A 的预读可以预热租户 B 需要的数据</li>
<li>租户 C 的 GC 可以顺带回收租户 D 的无效页</li>
</ul>
</li>
<li><strong>方法</strong>：识别协作模式 → 协作组内公平调度</li>
</ul>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-marpit-scope-rL7euxVp="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="59" style="" data-marpit-pagination-total="89" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-marpit-scope-broGEpDo="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="60" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="%E5%8D%8F%E4%BD%9C%E6%84%9F%E7%9F%A5%E6%9C%BA%E5%88%B6">协作感知机制</h3>

<p><img src="images/dac23-bg2.png" alt="" style="width:900px;" /></p>
<p>Step 1：识别租户协作模式（访问重叠度、时间相关性）</p>
<p><img src="images/dac23-bg3.png" alt="" style="width:900px;" /></p>
<p>Step 2：协作组内公平调度（组内优先协调，组间公平分配）</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-marpit-scope-rnCOpNgI="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="61" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="%E5%AE%9E%E9%AA%8C%E7%BB%93%E6%9E%9C-3">实验结果</h3>

<ul>
<li>多租户 SLO 合规率提升 15-30%</li>
<li>Jain 公平指数从 0.72 提升到 0.89</li>
<li>总吞吐未下降——协作感知释放了并行潜力</li>
<li>尾延迟公平性显著改善</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-marpit-scope-v05NfXhb="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="62" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="%E6%88%91%E4%BB%AC%E7%9A%84%E5%B7%A5%E4%BD%9C%E4%B8%89cofs-tcad24">我们的工作三：CoFS (TCAD'24)</h3>

<ul>
<li><a href="https://ieeexplore.ieee.org/document/10247718">CoFS: Collaboration-Aware Fairness for NVMe SSD</a>, TCAD 2024</li>
<li><strong>Fair Will Go On 的系统化</strong>：从方案到完整系统</li>
<li><strong>在 M2 中</strong>：CoFS 作为&quot;约束优化方法&quot;的代表（系统层 QoS 视角）</li>
<li><strong>在本讲中</strong>：CoFS 作为&quot;设备层公平调度&quot;的实现（机制视角）</li>
<li><strong>同一论文，两个视角——互补不重复</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-marpit-scope-TjdSkcKp="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="63" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="cofs-%E4%B8%A4%E8%AE%B2%E5%AF%B9%E6%AF%94">CoFS 两讲对比</h3>

<table>
<thead>
<tr>
<th>维度</th>
<th>M2 视角（系统层）</th>
<th>M3 视角（设备层）</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>关注点</strong></td>
<td>SLO 约束 → 全局最优</td>
<td>NVMe 队列 → 协作感知调度</td>
</tr>
<tr>
<td><strong>方法定位</strong></td>
<td>约束优化的代表</td>
<td>公平调度的实现</td>
</tr>
<tr>
<td><strong>抽象层级</strong></td>
<td>租户间资源分配</td>
<td>SSD 内部 I/O 调度</td>
</tr>
<tr>
<td><strong>关联</strong></td>
<td>提供上层 QoS 目标</td>
<td>提供底层机制保障</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-marpit-scope-4o0xt7TN="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="64" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="cofs-%E6%9C%BA%E5%88%B6%E8%AF%A6%E8%A7%A3">CoFS 机制详解</h3>

<ul>
<li><strong>NVMe 多队列调度</strong>：
<ul>
<li>每租户独立提交队列（SQ）+ 完成队列（CQ）</li>
<li>调度器按协作感知权重从各 SQ 提取 I/O</li>
</ul>
</li>
<li><strong>协作感知权重分配</strong>：
<ul>
<li>协作组内：优先协调 I/O 顺序</li>
<li>协作组间：按 SLO 权重公平分配</li>
</ul>
</li>
<li><strong>GC 协调</strong>：GC 选块时考虑多租户影响</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-marpit-scope-9lRtT13Q="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="65" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="%E4%B8%8E-m2-%E7%9A%84%E5%85%B3%E8%81%94-1">与 M2 的关联</h3>

<p><strong>设备层</strong>（M3）：CoFS 实现 NVMe SSD 内部的协作感知公平调度</p>
<p><img class="emoji" draggable="false" alt="↕" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2195.svg" data-marp-twemoji=""/></p>
<p><strong>系统层</strong>（M2）：CoFS 作为约束优化方法保障分布式存储 QoS</p>
<p><strong>同一篇论文，两个抽象层级</strong>——设备层提供机制，系统层提供目标</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" data-marpit-scope-W84QmwRv="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="66" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="%E5%B0%8F%E7%BB%93%E5%85%AC%E5%B9%B3%E6%80%A7%E9%9C%80%E8%A6%81%E9%A2%84%E6%B5%8B">小结：公平性需要预测</h3>

<ul>
<li>从被动隔离到协作感知：<strong>预测干扰模式</strong></li>
<li>公平性与并行性的权衡需要负载感知</li>
<li>协作感知 = 预测租户间的协作机会</li>
<li>设备层公平调度是系统层 QoS 保障的落地机制</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="67" data-marpit-scope-6i4WRI45="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="67" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h2 id="%E5%89%8D%E6%B2%BFai-%E6%97%B6%E4%BB%A3%E7%9A%84-ssd">前沿：AI 时代的 SSD</h2>

<p>介质创新 + 接口革新 + 计算融合 + 智能调度</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="68" data-marpit-scope-vfiKuhYy="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="68" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="ssd-%E6%8A%80%E6%9C%AF%E6%BC%94%E8%BF%9B">SSD 技术演进</h3>

<ul>
<li><strong>介质</strong>：SLC → MLC → TLC → QLC → PLC（每单元位数递增）</li>
<li><strong>接口</strong>：SATA → NVMe → CXL-attached</li>
<li><strong>形态</strong>：U.2 → E1.S → E3.S</li>
<li><strong>新范式</strong>：FDP / ZNS / KVSSD / 计算型存储</li>
</ul>
<p>AI 负载驱动 SSD 从&quot;通用存储&quot;向&quot;智能存储&quot;演进</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="69" data-marpit-scope-1s50tcdP="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="69" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="fdpflexible-data-placement">FDP（Flexible Data Placement）</h3>

<ul>
<li><strong>SNIA 标准</strong>：解耦数据放置与介质管理</li>
<li><strong>核心改进</strong>：主机控制数据放置到指定的 Placement Unit</li>
<li><strong>优势</strong>：
<ul>
<li>降低 WAF（减少 GC 搬移）</li>
<li>主机感知的放置策略</li>
<li>向后兼容 NVMe</li>
</ul>
</li>
<li><strong>与挑战一关联</strong>：FDP 将地址映射的部分控制权交给主机</li>
</ul>
<p>Source: <a href="https://www.snia.org/education/storage-networking-primer/what-fdp">SNIA FDP Specification</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="70" data-marpit-scope-eKgFnI51="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="70" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="znszoned-namespace">ZNS（Zoned Namespace）</h3>

<ul>
<li><strong>顺序写入区</strong>：每个 Zone 必须顺序写入</li>
<li><strong>主机控制数据放置</strong>：消除 FTL 的 GC 开销</li>
<li><strong>优势</strong>：
<ul>
<li><strong>零 GC</strong>：主机管理 Zone 内空间</li>
<li>降低 WAF 至接近 1</li>
<li>简化 FTL（无需地址映射和 GC）</li>
</ul>
</li>
<li><strong>挑战</strong>：需要应用适配顺序写入语义</li>
</ul>
<p>Source: <a href="https://nvmexpress.org/specification/nvme-zoned-namespace-command-set-specification-1-1a-2021-07-26/">NVMe ZNS Specification</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="71" data-marpit-scope-rCVaBIrq="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="71" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="kvssd">KVSSD</h3>

<ul>
<li><strong>键值接口 SSD</strong>：跳过文件系统开销</li>
<li><strong>直接 KV 存储</strong>：Put/Get/Delete API</li>
<li><strong>优势</strong>：
<ul>
<li>消除文件系统元数据开销</li>
<li>降低尾延迟</li>
<li>天然适配分布式 KV 存储（如 RocksDB）</li>
</ul>
</li>
<li><strong>与挑战二关联</strong>：KVSSD 的内部缓存管理是新的优化维度</li>
</ul>
<p>Source: <a href="https://www.snia.org/education/storage-networking-primer/what-kv-ssd">Key-Value SSD</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="72" data-marpit-scope-HylbvlPM="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="72" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="%E8%AE%A1%E7%AE%97%E5%9E%8B%E5%AD%98%E5%82%A8">计算型存储</h3>

<ul>
<li><strong>近数据计算</strong>（Near-Data Processing）：在 SSD 内部执行计算</li>
<li><strong>典型操作</strong>：
<ul>
<li>过滤：仅返回满足条件的数据</li>
<li>聚合：在 SSD 内完成 SUM/AVG</li>
<li>压缩：减少数据传输量</li>
</ul>
</li>
<li><strong>优势</strong>：减少数据搬运 → 降低延迟和功耗</li>
<li><strong>与 AI 关联</strong>：在 SSD 内执行模型推理的初探</li>
</ul>
<p>Source: <a href="https://www.snia.org/education/storage-networking-primer/what-computational-storage">Computational Storage</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="73" data-marpit-scope-TJoj8FlL="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="73" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="kv-cache-%E5%8D%B8%E8%BD%BD%E5%88%B0-ssd">KV Cache 卸载到 SSD</h3>

<ul>
<li><strong>以存换算</strong>：GPU 显存不够时，KV Cache 卸载到 SSD</li>
<li><strong>背景</strong>：大模型推理的 KV Cache 占用大量显存</li>
<li><strong>方案</strong>：
<ul>
<li>热 KV Cache 在 GPU 显存</li>
<li>温 KV Cache 在 SSD（NVMe 低延迟）</li>
<li>冷 KV Cache 在远端存储</li>
</ul>
</li>
<li><strong>对 SSD 的要求</strong>：超低尾延迟 + 高并发读</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="74" data-marpit-scope-V8U17h8a="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="74" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="gpu-%E7%9B%B4%E8%BF%9E-ssd">GPU 直连 SSD</h3>

<ul>
<li><strong>绕过 CPU 的数据通路</strong>：GPU <img class="emoji" draggable="false" alt="↔" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2194.svg" data-marp-twemoji=""/> SSD 直接读写</li>
<li><strong>技术</strong>：NVMe-oF / GPUDirect Storage</li>
<li><strong>优势</strong>：
<ul>
<li>消除 CPU 中转延迟</li>
<li>降低 PCIe 带宽争用</li>
<li>GPU 直接按需读取数据</li>
</ul>
</li>
<li><strong>场景</strong>：大规模 AI 训练的数据加载</li>
</ul>
<p>Source: <a href="https://docs.nvidia.com/gpudirect-storage/">GPUDirect Storage</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="75" data-marpit-scope-p4kfvABT="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="75" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="ai-ssd">AI SSD</h3>

<ul>
<li><strong>一个标签，六种逻辑</strong>：
<ol>
<li>AI 负载感知的 SSD（识别训练/推理 I/O 模式）</li>
<li>KV Cache 卸载的 SSD</li>
<li>GPU 直连的 SSD</li>
<li>计算型 SSD（模型推理）</li>
<li>高带宽闪存（HBF）SSD</li>
<li>智能调度 SSD（RL 驱动的 FTL）</li>
</ol>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="76" data-marpit-scope-uh9f4ls4="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="76" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="hbfhigh-bandwidth-flash">HBF（High Bandwidth Flash）</h3>

<ul>
<li><strong>高带宽闪存</strong>：AI 存储的新选项</li>
<li><strong>特点</strong>：
<ul>
<li>并行度极高（数千 Channel）</li>
<li>带宽 &gt; 1 TB/s</li>
<li>容量密度优于 HBM</li>
</ul>
</li>
<li><strong>定位</strong>：GPU 显存与 NVMe SSD 之间的新层级</li>
<li><strong>场景</strong>：大模型推理的 KV Cache 存储</li>
</ul>
<p>Source: <a href="https://www.samsung.com/semiconductor/newsroom/tech-trends/">Samsung HBF</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="77" data-marpit-scope-jisvlyBl="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="77" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="%E5%B0%8F%E7%BB%93ai-%E6%97%B6%E4%BB%A3%E7%9A%84-ssd">小结：AI 时代的 SSD</h3>

<p>AI 时代的 SSD = <strong>介质创新</strong> + <strong>接口革新</strong> + <strong>计算融合</strong> + <strong>智能调度</strong></p>
<ul>
<li>介质：QLC/PLC → 更高密度</li>
<li>接口：FDP/ZNS/KVSSD → 更灵活</li>
<li>计算：近数据计算 → 更低延迟</li>
<li>智能：RL 驱动 FTL → 更自适应</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="78" data-marpit-scope-dUaAuEpf="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="78" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h2 id="%E8%AF%BE%E5%A0%82%E6%BC%94%E7%A4%BA%E4%B8%8E%E5%AE%9E%E9%AA%8C">课堂演示与实验</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="79" data-marpit-scope-V3TVJMP1="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="79" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="%E6%BC%94%E7%A4%BA%E7%8E%AF%E5%A2%83">演示环境</h3>

<ul>
<li><strong>Python 缓存替换策略模拟器</strong>
<ul>
<li>支持：LRU / FIFO / Random / 多因子 / DRL</li>
<li>输入：I/O 访问 trace（顺序/随机/混合）</li>
<li>输出：命中率、替换次数、WAF 估算</li>
<li>2 分钟跑完，课堂冷启动无压力</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="80" data-marpit-scope-tSVviZQj="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="80" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="%E2%9A%A1-poe-%E9%A2%84%E6%B5%8B%E9%A1%B5"><img class="emoji" draggable="false" alt="⚡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/26a1.svg" data-marp-twemoji=""/> POE 预测页</h3>
<div class="highlight">
<p><strong>预测题</strong>（请先写下你的判断，再观看演示）：</p>
<p>给定访问序列 (A, B, C, A, D, E, A, B, F, A, ...)，缓存大小 = 3</p>
<p>LRU vs FIFO vs Random，谁的命中率高？</p>
<p>A) LRU　　B) FIFO　　C) Random　　D) 差不多</p>
<p><strong>理由</strong>：________________</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="81" data-marpit-scope-6ysWIn0I="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="81" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="%E6%BC%94%E7%A4%BA%E6%B5%81%E7%A8%8B">演示流程</h3>

<ul>
<li>3 段 × 15 min：
<ul>
<li>① <strong>经典策略对比</strong>：LRU vs FIFO vs Random 在不同 trace 下的命中率</li>
<li>② <strong>多因子 vs 经典</strong>：ICCD'22 多因子策略的优势</li>
<li>③ <strong>DRL vs 规则</strong>：学习驱动 vs 规则驱动</li>
</ul>
</li>
<li>每段后 5 min POE 讨论</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="82" data-marpit-scope-WcoEanB9="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="82" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="%E5%AE%9E%E9%AA%8C%E4%BD%9C%E4%B8%9A">实验作业</h3>

<ul>
<li>给定多个 trace（顺序/随机/混合）</li>
<li>实现自定义替换策略</li>
<li>评分：命中率（40%）+ WAF（30%）+ 方法报告（30%）</li>
<li>设 baseline 及格线：命中率 ≥ LRU</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="83" data-marpit-scope-PEV0hLF1="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="83" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">

<h2 id="%E6%80%BB%E7%BB%93%E4%B8%8E%E5%B1%95%E6%9C%9B">总结与展望</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="85" data-marpit-scope-znCSR9jc="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="85" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="%E4%B8%89%E6%8C%91%E6%88%98%E5%BD%92%E7%BA%B3">三挑战归纳</h3>

<p><strong>映射</strong> → 预测访问模式，优化地址分配<br />
↓<br />
<strong>缓存</strong> → 多维度预测，智能替换决策<br />
↓<br />
<strong>公平性</strong> → 预测干扰模式，协作感知调度</p>
<p>三挑战殊途同归：<strong>在 SSD 设备层引入预测方法加以优化</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="86" data-marpit-scope-ZAJUXW6L="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="86" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">

<h3 id="m2-%E2%86%94-m3-%E5%AF%B9%E5%81%B6">M2 <img class="emoji" draggable="false" alt="↔" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2194.svg" data-marp-twemoji=""/> M3 对偶</h3>

<p><strong>M2 系统层</strong>：分布式存储 → 性能预测 → QoS 保障</p>
<p><img class="emoji" draggable="false" alt="↕" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2195.svg" data-marp-twemoji=""/></p>
<p><strong>M3 设备层</strong>：闪存存储 → 预测优化 → 服务质量</p>
<p><strong>同一研究项目，两层优化</strong>：</p>
<ul>
<li>M2 在系统层引入预测方法保障服务质量</li>
<li>M3 在设备层引入预测方法优化存储机制</li>
<li>CoFS 一篇论文，两个视角，互补不重复</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="88" data-marpit-scope-BKCH5Stm="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="88" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="89">
<h3 id="%E6%9C%AA%E6%9D%A5%E6%96%B9%E5%90%91">未来方向</h3>

<ul>
<li><strong>FDP + RL 调度</strong>：主机控制放置 + 强化学习优化</li>
<li><strong>计算型存储</strong>：SSD 内部执行 AI 推理</li>
<li><strong>KV Cache 卸载</strong>：SSD 作为 GPU 显存扩展层</li>
<li><strong>HBF</strong>：高带宽闪存重塑存储层级</li>
<li><strong>端到端联合优化</strong>：设备层 + 系统层联合预测与调度</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="89" data-paginate="true" data-class="lead" data-theme="gaia" lang="zh-CN" class="lead" data-marpit-pagination="89" style="--paginate:true;--class:lead;--theme:gaia;" data-marpit-pagination-total="89">

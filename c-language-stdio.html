<h1 id="%E8%BD%AF%E4%BB%B6%E6%8A%80%E6%9C%AF%E5%9F%BA%E7%A1%80">软件技术基础</h1>

<h2 id="%E6%A0%BC%E5%BC%8F%E5%8C%96%E8%BE%93%E5%85%A5%E4%B8%8E%E8%BE%93%E5%87%BA">格式化输入与输出</h2>
<p><strong>施展</strong><br />
武汉光电国家研究中心 &amp; 计算机学院<br />
华中科技大学</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="2" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="24">
<h2 id="%E4%B8%BB%E8%A6%81%E5%86%85%E5%AE%B9">主要内容</h2>
<ul>
<li>字符输入输出函数</li>
<li>格式化输出函数 printf</li>
<li>格式化输入函数 scanf</li>
<li>格式控制符详解</li>
<li>宽度、精度与对齐</li>
<li>输入输出常见陷阱</li>
<li>字符串格式化函数</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-marpit-scope-kuf035mM="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="3" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="24">
<h2 id="%E5%AD%97%E7%AC%A6%E8%BE%93%E5%87%BA%E5%87%BD%E6%95%B0-putchar">字符输出函数 putchar</h2>

<p><strong>函数原型</strong>：<code>int putchar(int c);</code></p>
<ul>
<li>向标准输出（stdout）输出一个字符</li>
<li>参数为字符的 ASCII 码值</li>
<li>成功时返回输出的字符，失败返回 <code>EOF</code></li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-built_in">putchar</span>(<span class="hljs-string">&#x27;A&#x27;</span>);        <span class="hljs-comment">// 输出: A</span>
<span class="hljs-built_in">putchar</span>(<span class="hljs-number">65</span>);         <span class="hljs-comment">// 输出: A（65 是 &#x27;A&#x27; 的 ASCII 码）</span>
<span class="hljs-built_in">putchar</span>(<span class="hljs-string">&#x27;\n&#x27;</span>);       <span class="hljs-comment">// 输出换行</span>
<span class="hljs-type">char</span> ch = <span class="hljs-string">&#x27;Z&#x27;</span>;
<span class="hljs-built_in">putchar</span>(ch);         <span class="hljs-comment">// 输出: Z</span>
</code></pre>
<blockquote>
<p><code>putchar(c)</code> 等价于 <code>printf(&quot;%c&quot;, c)</code>，但更简洁高效</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-marpit-scope-tC8bICDN="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="4" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="24">
<h2 id="%E5%AD%97%E7%AC%A6%E8%BE%93%E5%85%A5%E5%87%BD%E6%95%B0-getchar">字符输入函数 getchar</h2>

<p><strong>函数原型</strong>：<code>int getchar(void);</code></p>
<ul>
<li>从标准输入（stdin）读取一个字符</li>
<li>返回读取字符的 ASCII 码值（<code>int</code> 类型）</li>
<li>遇到文件末尾或出错返回 <code>EOF</code>（通常为 -1）</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">int</span> ch;                    <span class="hljs-comment">// 注意：用 int 而不是 char</span>
ch = getchar();            <span class="hljs-comment">// 读取一个字符</span>
<span class="hljs-built_in">putchar</span>(ch);               <span class="hljs-comment">// 输出该字符</span>
</code></pre>
<p><strong>为什么要用 <code>int</code> 接收？</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">char</span> ch = getchar();       <span class="hljs-comment">// 错误示范</span>
<span class="hljs-comment">// 若返回 EOF（通常为 -1），赋给 char 后可能变成 255</span>
<span class="hljs-comment">// 导致无法正确判断文件结束</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-marpit-scope-APyxJqkK="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="24">
<h3 id="getchar-%E7%9A%84%E7%BC%93%E5%86%B2%E5%8C%BA%E7%89%B9%E6%80%A7">getchar 的缓冲区特性</h3>

<p><code>getchar</code> 读取的是<strong>行缓冲</strong>输入——用户按回车后，整行字符才送入程序</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;请输入一个字符：&quot;</span>);
<span class="hljs-type">int</span> ch = getchar();     <span class="hljs-comment">// 输入 &quot;A\n&quot;</span>
<span class="hljs-comment">// ch = &#x27;A&#x27;，但 &#x27;\n&#x27; 仍留在缓冲区！</span>
<span class="hljs-type">int</span> next = getchar();   <span class="hljs-comment">// next = &#x27;\n&#x27;，不会等待新输入</span>
</code></pre>
<p><strong>清空输入缓冲区的常用方法</strong>：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">int</span> ch;
<span class="hljs-keyword">while</span> ((ch = getchar()) != <span class="hljs-string">&#x27;\n&#x27;</span> &amp;&amp; ch != EOF)
    ;   <span class="hljs-comment">// 读取并丢弃剩余字符</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="24">
<h3 id="%E7%A4%BA%E4%BE%8B%E7%BB%9F%E8%AE%A1%E5%AD%97%E7%AC%A6%E6%95%B0">示例：统计字符数</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>

<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
    <span class="hljs-type">int</span> count = <span class="hljs-number">0</span>;
    <span class="hljs-type">int</span> ch;

    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;请输入一行文字（回车结束）：\n&quot;</span>);
    <span class="hljs-keyword">while</span> ((ch = getchar()) != <span class="hljs-string">&#x27;\n&#x27;</span> &amp;&amp; ch != EOF) {
        count++;
    }
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;共输入 %d 个字符\n&quot;</span>, count);

    <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
}
</code></pre>
<ul>
<li><code>getchar()</code> 每次读一个字符</li>
<li><code>!= '\n'</code> 遇到回车停止</li>
<li><code>!= EOF</code> 防止文件重定向时死循环</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-marpit-scope-cV4ocMiV="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="24">
<h2 id="%E6%A0%BC%E5%BC%8F%E5%8C%96%E8%BE%93%E5%87%BA%E5%87%BD%E6%95%B0-printf">格式化输出函数 printf</h2>

<p><strong>函数原型</strong>：<code>int printf(const char *format, ...);</code></p>
<ul>
<li>按指定格式向标准输出设备输出数据</li>
<li>返回值：成功输出的<strong>字符数</strong>；出错返回负值</li>
<li>格式字符串包含<strong>普通字符</strong>（原样输出）和<strong>格式控制符</strong>（以 <code>%</code> 开头）</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">int</span> n = <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;Hello, %s!\n&quot;</span>, <span class="hljs-string">&quot;World&quot;</span>);
<span class="hljs-comment">// 输出: Hello, World!</span>
<span class="hljs-comment">// n = 14（含换行符）</span>
</code></pre>
<p><strong>基本格式控制符</strong>：</p>
<table>
<thead>
<tr>
<th style="text-align:center">控制符</th>
<th style="text-align:left">类型</th>
<th style="text-align:left">示例</th>
<th style="text-align:left">输出</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:center"><code>%d</code></td>
<td style="text-align:left">int</td>
<td style="text-align:left"><code>printf(&quot;%d&quot;, 42)</code></td>
<td style="text-align:left"><code>42</code></td>
</tr>
<tr>
<td style="text-align:center"><code>%f</code></td>
<td style="text-align:left">double</td>
<td style="text-align:left"><code>printf(&quot;%f&quot;, 3.14)</code></td>
<td style="text-align:left"><code>3.140000</code></td>
</tr>
<tr>
<td style="text-align:center"><code>%c</code></td>
<td style="text-align:left">char</td>
<td style="text-align:left"><code>printf(&quot;%c&quot;, 'A')</code></td>
<td style="text-align:left"><code>A</code></td>
</tr>
<tr>
<td style="text-align:center"><code>%s</code></td>
<td style="text-align:left">字符串</td>
<td style="text-align:left"><code>printf(&quot;%s&quot;, &quot;hi&quot;)</code></td>
<td style="text-align:left"><code>hi</code></td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-marpit-scope-aAp2wzXt="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="24">
<h3 id="%E5%AE%8C%E6%95%B4%E6%A0%BC%E5%BC%8F%E6%8E%A7%E5%88%B6%E7%AC%A6%E8%AF%AD%E6%B3%95">完整格式控制符语法</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>%  [标志]  [宽度]  [.精度]  [长度修饰]  转换说明符
   - + 0    数字    .数字     h l ll
   空格 #
</code></pre>
<table>
<thead>
<tr>
<th style="text-align:left">部分</th>
<th style="text-align:left">作用</th>
<th style="text-align:left">示例</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">标志</td>
<td style="text-align:left">控制对齐、符号、填充</td>
<td style="text-align:left"><code>-</code> 左对齐、<code>+</code> 显示正号、<code>0</code> 补零、<code>#</code> 替代形式</td>
</tr>
<tr>
<td style="text-align:left">宽度</td>
<td style="text-align:left">最小输出宽度</td>
<td style="text-align:left"><code>%10d</code> 占 10 位</td>
</tr>
<tr>
<td style="text-align:left">精度</td>
<td style="text-align:left">小数位数 / 字符串最大长度</td>
<td style="text-align:left"><code>%.2f</code> 2 位小数</td>
</tr>
<tr>
<td style="text-align:left">长度修饰</td>
<td style="text-align:left">指定参数大小</td>
<td style="text-align:left"><code>%ld</code>(long)、<code>%lld</code>(long long)、<code>%zu</code>(size_t)</td>
</tr>
<tr>
<td style="text-align:left">转换说明符</td>
<td style="text-align:left">指定数据类型</td>
<td style="text-align:left"><code>d</code>、<code>f</code>、<code>c</code>、<code>s</code>、<code>x</code>、<code>o</code>、<code>p</code></td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--theme:gaia;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="24" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;images/c-stdio-format.svg&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="9" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--theme:gaia;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="24" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h2 id="printf-%E6%A0%BC%E5%BC%8F%E4%B8%B2%E7%BB%93%E6%9E%84%E5%9B%BE%E7%A4%BA">printf 格式串结构（图示）</h2>

<p>一个格式控制符由五部分按固定顺序组成：</p>
<ul>
<li><code>%</code> 起始符</li>
<li><strong>标志</strong> <code>-</code> 左对齐、<code>+</code> 正负号、<code>0</code> 补零</li>
<li><strong>宽度</strong> 最小输出位数</li>
<li><strong>精度</strong> <code>.n</code> 小数位数或字符串最大长度</li>
<li><strong>转换符</strong> <code>d/f/c/s/x</code> 等决定数据类型</li>
</ul>
<p>记不住顺序时，记住口诀：<strong>% 标志 宽度 .精度 长度 类型</strong>。</p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="9" style="" data-marpit-pagination-total="24" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-marpit-scope-OrchnQFg="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="24">
<h3 id="%E6%95%B4%E6%95%B0%E6%A0%BC%E5%BC%8F%E6%8E%A7%E5%88%B6%E7%AC%A6">整数格式控制符</h3>

<table>
<thead>
<tr>
<th style="text-align:left">控制符</th>
<th style="text-align:left">含义</th>
<th style="text-align:left">示例</th>
<th style="text-align:left">输出</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><code>%d</code> / <code>%i</code></td>
<td style="text-align:left">有符号十进制</td>
<td style="text-align:left"><code>printf(&quot;%d&quot;, 42)</code></td>
<td style="text-align:left"><code>42</code></td>
</tr>
<tr>
<td style="text-align:left"><code>%u</code></td>
<td style="text-align:left">无符号十进制</td>
<td style="text-align:left"><code>printf(&quot;%u&quot;, 42U)</code></td>
<td style="text-align:left"><code>42</code></td>
</tr>
<tr>
<td style="text-align:left"><code>%o</code></td>
<td style="text-align:left">无符号八进制</td>
<td style="text-align:left"><code>printf(&quot;%o&quot;, 10)</code></td>
<td style="text-align:left"><code>12</code></td>
</tr>
<tr>
<td style="text-align:left"><code>%x</code></td>
<td style="text-align:left">无符号十六进制（小写）</td>
<td style="text-align:left"><code>printf(&quot;%x&quot;, 255)</code></td>
<td style="text-align:left"><code>ff</code></td>
</tr>
<tr>
<td style="text-align:left"><code>%X</code></td>
<td style="text-align:left">无符号十六进制（大写）</td>
<td style="text-align:left"><code>printf(&quot;%X&quot;, 255)</code></td>
<td style="text-align:left"><code>FF</code></td>
</tr>
<tr>
<td style="text-align:left"><code>%#o</code></td>
<td style="text-align:left">带前缀八进制</td>
<td style="text-align:left"><code>printf(&quot;%#o&quot;, 10)</code></td>
<td style="text-align:left"><code>012</code></td>
</tr>
<tr>
<td style="text-align:left"><code>%#x</code></td>
<td style="text-align:left">带前缀十六进制</td>
<td style="text-align:left"><code>printf(&quot;%#x&quot;, 255)</code></td>
<td style="text-align:left"><code>0xff</code></td>
</tr>
<tr>
<td style="text-align:left"><code>%ld</code></td>
<td style="text-align:left">long 十进制</td>
<td style="text-align:left"><code>printf(&quot;%ld&quot;, 123456L)</code></td>
<td style="text-align:left"><code>123456</code></td>
</tr>
<tr>
<td style="text-align:left"><code>%lld</code></td>
<td style="text-align:left">long long 十进制</td>
<td style="text-align:left"><code>printf(&quot;%lld&quot;, 1LL&lt;&lt;40)</code></td>
<td style="text-align:left"><code>1099511627776</code></td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-marpit-scope-RoLMBW0N="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="24">
<h3 id="%E6%B5%AE%E7%82%B9%E6%95%B0%E6%A0%BC%E5%BC%8F%E6%8E%A7%E5%88%B6%E7%AC%A6">浮点数格式控制符</h3>

<table>
<thead>
<tr>
<th style="text-align:left">控制符</th>
<th style="text-align:left">含义</th>
<th style="text-align:left">示例</th>
<th style="text-align:left">输出</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><code>%f</code></td>
<td style="text-align:left">小数形式（默认6位）</td>
<td style="text-align:left"><code>printf(&quot;%f&quot;, 3.14)</code></td>
<td style="text-align:left"><code>3.140000</code></td>
</tr>
<tr>
<td style="text-align:left"><code>%.2f</code></td>
<td style="text-align:left">2位小数</td>
<td style="text-align:left"><code>printf(&quot;%.2f&quot;, 3.14159)</code></td>
<td style="text-align:left"><code>3.14</code></td>
</tr>
<tr>
<td style="text-align:left"><code>%e</code></td>
<td style="text-align:left">科学计数法（小写e）</td>
<td style="text-align:left"><code>printf(&quot;%e&quot;, 0.001)</code></td>
<td style="text-align:left"><code>1.000000e-03</code></td>
</tr>
<tr>
<td style="text-align:left"><code>%E</code></td>
<td style="text-align:left">科学计数法（大写E）</td>
<td style="text-align:left"><code>printf(&quot;%E&quot;, 0.001)</code></td>
<td style="text-align:left"><code>1.000000E-03</code></td>
</tr>
<tr>
<td style="text-align:left"><code>%g</code></td>
<td style="text-align:left">自动选择 %f 或 %e</td>
<td style="text-align:left"><code>printf(&quot;%g&quot;, 0.0001)</code></td>
<td style="text-align:left"><code>0.0001</code></td>
</tr>
<tr>
<td style="text-align:left"><code>%g</code></td>
<td style="text-align:left">自动选择</td>
<td style="text-align:left"><code>printf(&quot;%g&quot;, 0.00001)</code></td>
<td style="text-align:left"><code>1e-05</code></td>
</tr>
</tbody>
</table>
<p><strong><code>%g</code> 的规则</strong>：指数 &lt; -4 或 ≥ 精度时用 <code>%e</code>，否则用 <code>%f</code></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-marpit-scope-zjXEKJL5="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="24">
<h3 id="%E5%AE%BD%E5%BA%A6%E4%B8%8E%E7%B2%BE%E5%BA%A6%E6%8E%A7%E5%88%B6">宽度与精度控制</h3>

<table>
<thead>
<tr>
<th style="text-align:left">格式</th>
<th style="text-align:left">含义</th>
<th style="text-align:left">示例值</th>
<th style="text-align:left">输出</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><code>%10d</code></td>
<td style="text-align:left">最小宽度10，右对齐</td>
<td style="text-align:left"><code>42</code></td>
<td style="text-align:left"><code>        42</code></td>
</tr>
<tr>
<td style="text-align:left"><code>%-10d</code></td>
<td style="text-align:left">最小宽度10，左对齐</td>
<td style="text-align:left"><code>42</code></td>
<td style="text-align:left"><code>42        </code></td>
</tr>
<tr>
<td style="text-align:left"><code>%010d</code></td>
<td style="text-align:left">最小宽度10，补零</td>
<td style="text-align:left"><code>42</code></td>
<td style="text-align:left"><code>0000000042</code></td>
</tr>
<tr>
<td style="text-align:left"><code>%+d</code></td>
<td style="text-align:left">显示正负号</td>
<td style="text-align:left"><code>42</code></td>
<td style="text-align:left"><code>+42</code></td>
</tr>
<tr>
<td style="text-align:left"><code>% d</code></td>
<td style="text-align:left">正数前加空格</td>
<td style="text-align:left"><code>42</code></td>
<td style="text-align:left"><code> 42</code></td>
</tr>
<tr>
<td style="text-align:left"><code>%.4f</code></td>
<td style="text-align:left">4位小数</td>
<td style="text-align:left"><code>3.14</code></td>
<td style="text-align:left"><code>3.1400</code></td>
</tr>
<tr>
<td style="text-align:left"><code>%10.2f</code></td>
<td style="text-align:left">宽度10，2位小数</td>
<td style="text-align:left"><code>3.14159</code></td>
<td style="text-align:left"><code>      3.14</code></td>
</tr>
<tr>
<td style="text-align:left"><code>%-10.2f</code></td>
<td style="text-align:left">左对齐</td>
<td style="text-align:left"><code>3.14159</code></td>
<td style="text-align:left"><code>3.14      </code></td>
</tr>
<tr>
<td style="text-align:left"><code>%.5s</code></td>
<td style="text-align:left">最多输出5个字符</td>
<td style="text-align:left"><code>&quot;hello world&quot;</code></td>
<td style="text-align:left"><code>hello</code></td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="24">
<h3 id="%E5%AE%BD%E5%BA%A6%E4%B8%8E%E7%B2%BE%E5%BA%A6%E7%A4%BA%E4%BE%8B">宽度与精度示例</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>

<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
    <span class="hljs-type">int</span> i = <span class="hljs-number">42</span>;
    <span class="hljs-type">double</span> d = <span class="hljs-number">3.14159265</span>;
    <span class="hljs-type">char</span> *s = <span class="hljs-string">&quot;Hello&quot;</span>;

    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;[%d]\n&quot;</span>, i);           <span class="hljs-comment">// [42]</span>
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;[%10d]\n&quot;</span>, i);         <span class="hljs-comment">// [        42]</span>
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;[%-10d]\n&quot;</span>, i);        <span class="hljs-comment">// [42        ]</span>
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;[%010d]\n&quot;</span>, i);        <span class="hljs-comment">// [0000000042]</span>
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;[%+d]\n&quot;</span>, i);          <span class="hljs-comment">// [+42]</span>

    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;[%.2f]\n&quot;</span>, d);         <span class="hljs-comment">// [3.14]</span>
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;[%10.2f]\n&quot;</span>, d);       <span class="hljs-comment">// [      3.14]</span>
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;[%-10.2f]\n&quot;</span>, d);      <span class="hljs-comment">// [3.14      ]</span>

    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;[%.3s]\n&quot;</span>, s);         <span class="hljs-comment">// [Hel]</span>
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;[%10.3s]\n&quot;</span>, s);       <span class="hljs-comment">// [       Hel]</span>

    <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-marpit-scope-7ihBpY2k="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="24">
<h2 id="%E6%A0%BC%E5%BC%8F%E5%8C%96%E8%BE%93%E5%85%A5%E5%87%BD%E6%95%B0-scanf">格式化输入函数 scanf</h2>

<p><strong>函数原型</strong>：<code>int scanf(const char *format, ...);</code></p>
<ul>
<li>按指定格式从标准输入读取数据</li>
<li>返回值：成功匹配并赋值的<strong>项数</strong>；遇到文件末尾返回 <code>EOF</code></li>
<li>参数必须是变量的<strong>地址</strong>（用 <code>&amp;</code> 取地址）</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">int</span> a, b;
<span class="hljs-type">int</span> ret = <span class="hljs-built_in">scanf</span>(<span class="hljs-string">&quot;%d%d&quot;</span>, &amp;a, &amp;b);
<span class="hljs-comment">// 输入 &quot;3 5&quot;，ret = 2（成功读入2项）</span>
<span class="hljs-comment">// 输入 &quot;3 abc&quot;，ret = 1（只成功读入a）</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-marpit-scope-RlZ9fCXX="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="24">
<h3 id="scanf-%E6%A0%BC%E5%BC%8F%E6%8E%A7%E5%88%B6%E7%AC%A6">scanf 格式控制符</h3>

<table>
<thead>
<tr>
<th style="text-align:left">控制符</th>
<th style="text-align:left">读取类型</th>
<th style="text-align:left">参数类型</th>
<th style="text-align:left">示例</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><code>%d</code></td>
<td style="text-align:left">十进制整数</td>
<td style="text-align:left"><code>int *</code></td>
<td style="text-align:left"><code>scanf(&quot;%d&quot;, &amp;n)</code></td>
</tr>
<tr>
<td style="text-align:left"><code>%ld</code></td>
<td style="text-align:left">long 整数</td>
<td style="text-align:left"><code>long *</code></td>
<td style="text-align:left"><code>scanf(&quot;%ld&quot;, &amp;ln)</code></td>
</tr>
<tr>
<td style="text-align:left"><code>%lld</code></td>
<td style="text-align:left">long long 整数</td>
<td style="text-align:left"><code>long long *</code></td>
<td style="text-align:left"><code>scanf(&quot;%lld&quot;, &amp;lln)</code></td>
</tr>
<tr>
<td style="text-align:left"><code>%f</code></td>
<td style="text-align:left">浮点数</td>
<td style="text-align:left"><code>float *</code></td>
<td style="text-align:left"><code>scanf(&quot;%f&quot;, &amp;f)</code></td>
</tr>
<tr>
<td style="text-align:left"><code>%lf</code></td>
<td style="text-align:left">双精度浮点</td>
<td style="text-align:left"><code>double *</code></td>
<td style="text-align:left"><code>scanf(&quot;%lf&quot;, &amp;d)</code></td>
</tr>
<tr>
<td style="text-align:left"><code>%c</code></td>
<td style="text-align:left">单个字符</td>
<td style="text-align:left"><code>char *</code></td>
<td style="text-align:left"><code>scanf(&quot;%c&quot;, &amp;ch)</code></td>
</tr>
<tr>
<td style="text-align:left"><code>%s</code></td>
<td style="text-align:left">字符串（遇空白停止）</td>
<td style="text-align:left"><code>char *</code></td>
<td style="text-align:left"><code>scanf(&quot;%s&quot;, str)</code></td>
</tr>
<tr>
<td style="text-align:left"><code>%x</code></td>
<td style="text-align:left">十六进制整数</td>
<td style="text-align:left"><code>unsigned int *</code></td>
<td style="text-align:left"><code>scanf(&quot;%x&quot;, &amp;hex)</code></td>
</tr>
<tr>
<td style="text-align:left"><code>%o</code></td>
<td style="text-align:left">八进制整数</td>
<td style="text-align:left"><code>unsigned int *</code></td>
<td style="text-align:left"><code>scanf(&quot;%o&quot;, &amp;oct)</code></td>
</tr>
<tr>
<td style="text-align:left"><code>%[]</code></td>
<td style="text-align:left">字符集合</td>
<td style="text-align:left"><code>char *</code></td>
<td style="text-align:left"><code>scanf(&quot;%[a-z]&quot;, str)</code></td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>重要</strong>：<code>scanf</code> 读 <code>double</code> 必须用 <code>%lf</code>；<code>printf</code> 输出 <code>double</code> 用 <code>%f</code> 即可（自动提升）</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-marpit-scope-pJQXA397="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="24">
<h3 id="scanf-%E8%AF%BB%E5%8F%96%E5%AD%97%E7%AC%A6%E4%B8%8E%E5%AD%97%E7%AC%A6%E4%B8%B2">scanf 读取字符与字符串</h3>

<p><strong><code>%c</code> 的问题</strong>：会读取空白字符（包括换行符）</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">int</span> n; <span class="hljs-type">char</span> ch;
<span class="hljs-built_in">scanf</span>(<span class="hljs-string">&quot;%d&quot;</span>, &amp;n);       <span class="hljs-comment">// 输入 &quot;42\n&quot;</span>
<span class="hljs-built_in">scanf</span>(<span class="hljs-string">&quot;%c&quot;</span>, &amp;ch);      <span class="hljs-comment">// ch = &#x27;\n&#x27;！不是等待新输入</span>
</code></pre>
<p><strong>解决方法</strong>：在 <code>%c</code> 前加空格，跳过空白</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-built_in">scanf</span>(<span class="hljs-string">&quot; %c&quot;</span>, &amp;ch);     <span class="hljs-comment">// 空格会跳过所有空白字符</span>
</code></pre>
<p><strong><code>%s</code> 的行为</strong>：遇空白停止，自动加 <code>'\0'</code></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">char</span> name[<span class="hljs-number">20</span>];
<span class="hljs-built_in">scanf</span>(<span class="hljs-string">&quot;%s&quot;</span>, name);     <span class="hljs-comment">// 输入 &quot;Hello World&quot;</span>
<span class="hljs-comment">// name = &quot;Hello&quot;，&quot;World&quot; 留在缓冲区</span>
</code></pre>
<blockquote>
<p><strong>安全提示</strong>：<code>scanf(&quot;%s&quot;, name)</code> 不检查长度，应改用 <code>scanf(&quot;%19s&quot;, name)</code> 或用 <code>fgets</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-marpit-scope-1ABf4n1y="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="24">
<h3 id="scanf-%E7%9A%84%E8%BF%94%E5%9B%9E%E5%80%BC%E4%B8%8E%E9%94%99%E8%AF%AF%E5%A4%84%E7%90%86">scanf 的返回值与错误处理</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">int</span> a, b;
<span class="hljs-type">int</span> ret = <span class="hljs-built_in">scanf</span>(<span class="hljs-string">&quot;%d%d&quot;</span>, &amp;a, &amp;b);

<span class="hljs-keyword">if</span> (ret == <span class="hljs-number">2</span>) {
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;成功读取: a=%d, b=%d\n&quot;</span>, a, b);
} <span class="hljs-keyword">else</span> <span class="hljs-keyword">if</span> (ret == EOF) {
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;输入结束（Ctrl+D / Ctrl+Z）\n&quot;</span>);
} <span class="hljs-keyword">else</span> {
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;输入格式错误，仅成功读取 %d 项\n&quot;</span>, ret);
    <span class="hljs-comment">// 清除错误输入，防止死循环</span>
    <span class="hljs-type">int</span> ch;
    <span class="hljs-keyword">while</span> ((ch = getchar()) != <span class="hljs-string">&#x27;\n&#x27;</span> &amp;&amp; ch != EOF)
        ;
}
</code></pre>
<p><strong>典型陷阱</strong>：输入不匹配时，错误数据留在缓冲区，后续 <code>scanf</code> 反复失败</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>输入: abc
scanf(&quot;%d&quot;, &amp;a)  → 返回 0，&quot;abc&quot; 留在缓冲区
scanf(&quot;%d&quot;, &amp;a)  → 返回 0，&quot;abc&quot; 还在
...死循环
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-marpit-scope-t3LfKSJ3="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="24">
<h3 id="scanf-%E7%9A%84%E9%AB%98%E7%BA%A7%E7%94%A8%E6%B3%95">scanf 的高级用法</h3>

<p><strong>1. 限制读取长度</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">char</span> name[<span class="hljs-number">20</span>];
<span class="hljs-built_in">scanf</span>(<span class="hljs-string">&quot;%19s&quot;</span>, name);      <span class="hljs-comment">// 最多读19个字符，保留1位给 &#x27;\0&#x27;</span>
</code></pre>
<p><strong>2. 扫描集 <code>%[]</code></strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">char</span> str[<span class="hljs-number">100</span>];
<span class="hljs-built_in">scanf</span>(<span class="hljs-string">&quot;%[a-zA-Z]&quot;</span>, str);     <span class="hljs-comment">// 只读字母，遇非字母停止</span>
<span class="hljs-built_in">scanf</span>(<span class="hljs-string">&quot;%[^0-9]&quot;</span>, str);        <span class="hljs-comment">// 读到数字为止（^ 表示取反）</span>
<span class="hljs-built_in">scanf</span>(<span class="hljs-string">&quot;%[^\n]&quot;</span>, str);         <span class="hljs-comment">// 读整行（直到换行）</span>
</code></pre>
<p><strong>3. 赋值抑制 <code>*</code></strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">int</span> year, day;
<span class="hljs-built_in">scanf</span>(<span class="hljs-string">&quot;%d%*c%d&quot;</span>, &amp;year, &amp;day);  <span class="hljs-comment">// %*c 读取但丢弃一个字符（如斜杠）</span>
<span class="hljs-comment">// 输入 &quot;2024/15&quot; → year=2024, day=15</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-marpit-scope-GnlfNzqs="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="24">
<h2 id="%E5%AD%97%E7%AC%A6%E4%B8%B2%E8%BE%93%E5%85%A5%E5%87%BD%E6%95%B0-gets-%E4%B8%8E-fgets">字符串输入函数 gets 与 fgets</h2>

<p><strong><code>gets</code>（已废弃，C11 移除）</strong>：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">char</span> line[<span class="hljs-number">100</span>];
gets(line);     <span class="hljs-comment">// 危险！不检查缓冲区长度，极易溢出</span>
</code></pre>
<p><strong><code>fgets</code>（推荐）</strong>：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">char</span> line[<span class="hljs-number">100</span>];
fgets(line, <span class="hljs-keyword">sizeof</span>(line), <span class="hljs-built_in">stdin</span>);   <span class="hljs-comment">// 最多读 sizeof(line)-1 个字符</span>
</code></pre>
<ul>
<li><code>fgets</code> 会把换行符也读入字符串（如果缓冲区放得下）</li>
<li>需要手动去除尾部换行符：</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c">fgets(line, <span class="hljs-keyword">sizeof</span>(line), <span class="hljs-built_in">stdin</span>);
<span class="hljs-type">size_t</span> len = <span class="hljs-built_in">strlen</span>(line);
<span class="hljs-keyword">if</span> (len &gt; <span class="hljs-number">0</span> &amp;&amp; line[len - <span class="hljs-number">1</span>] == <span class="hljs-string">&#x27;\n&#x27;</span>) {
    line[len - <span class="hljs-number">1</span>] = <span class="hljs-string">&#x27;\0&#x27;</span>;    <span class="hljs-comment">// 去掉换行符</span>
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-marpit-scope-MK91wx2P="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="24">
<h2 id="%E5%AD%97%E7%AC%A6%E4%B8%B2%E6%A0%BC%E5%BC%8F%E5%8C%96%E5%87%BD%E6%95%B0-sprintf--sscanf">字符串格式化函数 sprintf / sscanf</h2>

<p><strong><code>sprintf</code></strong>：将格式化数据写入字符串（而非 stdout）</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">char</span> buf[<span class="hljs-number">100</span>];
<span class="hljs-type">int</span> age = <span class="hljs-number">20</span>;
<span class="hljs-type">char</span> name[] = <span class="hljs-string">&quot;Alice&quot;</span>;
<span class="hljs-built_in">sprintf</span>(buf, <span class="hljs-string">&quot;%s is %d years old.&quot;</span>, name, age);
<span class="hljs-comment">// buf = &quot;Alice is 20 years old.&quot;</span>
</code></pre>
<p><strong><code>snprintf</code></strong>（安全版本，推荐）：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">char</span> buf[<span class="hljs-number">10</span>];
<span class="hljs-built_in">snprintf</span>(buf, <span class="hljs-keyword">sizeof</span>(buf), <span class="hljs-string">&quot;Hello %s&quot;</span>, <span class="hljs-string">&quot;World&quot;</span>);  <span class="hljs-comment">// 自动截断，不会溢出</span>
</code></pre>
<p><strong><code>sscanf</code></strong>：从字符串中读取格式化数据</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">char</span> str[] = <span class="hljs-string">&quot;2024-06-09&quot;</span>;
<span class="hljs-type">int</span> year, month, day;
<span class="hljs-built_in">sscanf</span>(str, <span class="hljs-string">&quot;%d-%d-%d&quot;</span>, &amp;year, &amp;month, &amp;day);
<span class="hljs-comment">// year=2024, month=6, day=9</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-marpit-scope-Z44Nixmw="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="24">
<h3 id="sscanf-%E5%AE%9E%E7%94%A8%E7%A4%BA%E4%BE%8B">sscanf 实用示例</h3>

<p><strong>解析 IP 地址</strong>：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">char</span> ip[] = <span class="hljs-string">&quot;192.168.1.100&quot;</span>;
<span class="hljs-type">int</span> a, b, c, d;
<span class="hljs-built_in">sscanf</span>(ip, <span class="hljs-string">&quot;%d.%d.%d.%d&quot;</span>, &amp;a, &amp;b, &amp;c, &amp;d);
<span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%d.%d.%d.%d\n&quot;</span>, a, b, c, d);
</code></pre>
<p><strong>从字符串提取数值</strong>：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">char</span> info[] = <span class="hljs-string">&quot;Score: 95, Rank: 3&quot;</span>;
<span class="hljs-type">int</span> score, rank;
<span class="hljs-built_in">sscanf</span>(info, <span class="hljs-string">&quot;Score: %d, Rank: %d&quot;</span>, &amp;score, &amp;rank);
</code></pre>
<p><strong>分离整数和小数部分</strong>：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">char</span> num[] = <span class="hljs-string">&quot;3.14159&quot;</span>;
<span class="hljs-type">int</span> integer;
<span class="hljs-type">double</span> fraction;
<span class="hljs-built_in">sscanf</span>(num, <span class="hljs-string">&quot;%d.%lf&quot;</span>, &amp;integer, &amp;fraction);
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-marpit-scope-6BPxoAst="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="24">
<h2 id="%E8%BE%93%E5%85%A5%E8%BE%93%E5%87%BA%E5%B8%B8%E8%A7%81%E9%99%B7%E9%98%B1%E6%80%BB%E7%BB%93">输入输出常见陷阱总结</h2>

<table>
<thead>
<tr>
<th style="text-align:left">陷阱</th>
<th style="text-align:left">错误写法</th>
<th style="text-align:left">正确写法</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">scanf 读 double 用 %f</td>
<td style="text-align:left"><code>scanf(&quot;%f&quot;, &amp;d)</code></td>
<td style="text-align:left"><code>scanf(&quot;%lf&quot;, &amp;d)</code></td>
</tr>
<tr>
<td style="text-align:left">scanf %c 读到换行</td>
<td style="text-align:left"><code>scanf(&quot;%c&quot;, &amp;ch)</code></td>
<td style="text-align:left"><code>scanf(&quot; %c&quot;, &amp;ch)</code></td>
</tr>
<tr>
<td style="text-align:left">gets 缓冲区溢出</td>
<td style="text-align:left"><code>gets(buf)</code></td>
<td style="text-align:left"><code>fgets(buf, sizeof(buf), stdin)</code></td>
</tr>
<tr>
<td style="text-align:left">scanf 不检查返回值</td>
<td style="text-align:left"><code>scanf(&quot;%d&quot;, &amp;n)</code></td>
<td style="text-align:left"><code>if (scanf(&quot;%d&quot;, &amp;n) != 1) { ... }</code></td>
</tr>
<tr>
<td style="text-align:left">整数除法误用</td>
<td style="text-align:left"><code>double r = a / b</code></td>
<td style="text-align:left"><code>double r = (double)a / b</code></td>
</tr>
<tr>
<td style="text-align:left">printf %d 与 %f 混用</td>
<td style="text-align:left"><code>printf(&quot;%d&quot;, 3.14)</code></td>
<td style="text-align:left"><code>printf(&quot;%f&quot;, 3.14)</code></td>
</tr>
<tr>
<td style="text-align:left">scanf %s 不限长度</td>
<td style="text-align:left"><code>scanf(&quot;%s&quot;, buf)</code></td>
<td style="text-align:left"><code>scanf(&quot;%99s&quot;, buf)</code></td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-marpit-scope-HGcNak62="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="24">
<h2 id="%E7%BB%BC%E5%90%88%E7%BB%83%E4%B9%A0">综合练习</h2>

<p><strong>题目</strong>：编写程序，输入学生姓名和三门课成绩，计算平均分并以表格形式输出</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>

<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
    <span class="hljs-type">char</span> name[<span class="hljs-number">20</span>];
    <span class="hljs-type">float</span> s1, s2, s3;

    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;请输入姓名：&quot;</span>);
    <span class="hljs-built_in">scanf</span>(<span class="hljs-string">&quot;%19s&quot;</span>, name);
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;请输入三门课成绩（空格分隔）：&quot;</span>);
    <span class="hljs-built_in">scanf</span>(<span class="hljs-string">&quot;%f%f%f&quot;</span>, &amp;s1, &amp;s2, &amp;s3);

    <span class="hljs-type">float</span> avg = (s1 + s2 + s3) / <span class="hljs-number">3</span>;

    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;\n%-10s %6s %6s %6s %6s\n&quot;</span>, <span class="hljs-string">&quot;姓名&quot;</span>, <span class="hljs-string">&quot;课1&quot;</span>, <span class="hljs-string">&quot;课2&quot;</span>, <span class="hljs-string">&quot;课3&quot;</span>, <span class="hljs-string">&quot;平均&quot;</span>);
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%-10s %6.1f %6.1f %6.1f %6.2f\n&quot;</span>, name, s1, s2, s3, avg);

    <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-marpit-scope-sk5God9m="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="24">
<h2 id="%E6%80%BB%E7%BB%93">总结</h2>

<ul>
<li><strong>字符 I/O</strong>：<code>putchar</code>/<code>getchar</code>，注意 <code>getchar</code> 返回 <code>int</code> 和缓冲区特性</li>
<li><strong>printf</strong>：格式控制符语法 <code>%[标志][宽度][.精度][长度]类型</code></li>
<li><strong>scanf</strong>：参数必须是地址（<code>&amp;</code>），注意 <code>%lf</code> 读 double、<code>%c</code> 前加空格</li>
<li><strong>宽度与精度</strong>：<code>%10d</code>、<code>%-10d</code>、<code>%010d</code>、<code>%.2f</code>、<code>%10.2f</code></li>
<li><strong>安全输入</strong>：用 <code>fgets</code> 替代 <code>gets</code>，用 <code>%99s</code> 限制 <code>scanf</code> 的 <code>%s</code> 长度</li>
<li><strong>字符串 I/O</strong>：<code>sprintf</code>/<code>snprintf</code>（格式化写入字符串）、<code>sscanf</code>（从字符串读取）</li>
<li><strong>返回值</strong>：<code>printf</code> 返回输出字符数，<code>scanf</code> 返回成功赋值项数</li>
</ul>
</section>

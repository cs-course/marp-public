<h2 id="%E6%9C%8D%E5%8A%A1%E7%AD%89%E7%BA%A7%E5%8D%8F%E8%AE%AE%E6%9C%8D%E5%8A%A1%E7%AD%89%E7%BA%A7%E7%9B%AE%E6%A0%87%E6%9C%8D%E5%8A%A1%E7%AD%89%E7%BA%A7%E6%8C%87%E6%A0%87">服务等级协议、服务等级目标、服务等级指标</h2>
<ul>
<li><strong>服务等级协议</strong>(SLA)：协议双方签订的<strong>具有法律约束力</strong>的合同</li>
<li><strong>服务等级目标</strong>(SLO)：指定服务所提供功能的一种<strong>期望状态</strong></li>
<li><strong>服务等级指标</strong>(SLI)：经过仔细定义的<strong>测量指标</strong></li>
</ul>
<p>Source: <a href="https://xie.infoq.cn/article/eda3b32806bc800173793118e">SLO（服务等级目标）与 SLA（服务等级协议）</a></p>

</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-marpit-scope-dl2n6OVu="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="15" style="" data-marpit-pagination-total="86" data-marpit-advanced-background="pseudo"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-marpit-scope-gv9A0yGA="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="86">
<h3 id="%E5%BD%92%E7%BA%B3%E4%B8%80%E4%B8%8B">归纳一下……</h3>

<ul>
<li>SLA是法律文书而非技术文档，重在严格约束而非技术实现，<strong>难在协商</strong></li>
<li>SLO是细分后的具体目标承诺，重在明确量化而非如何测量，<strong>难在提炼</strong></li>
<li>SLI是监控采集的实际观测值，需要精辟选择合适指标，<strong>难在精准观测</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="86">
<h3 id="%E8%8C%83%E4%BE%8B--web-%E6%9C%8D%E5%8A%A1%E5%99%A8%E5%8F%AF%E7%94%A8%E6%80%A7%E5%92%8C%E5%BB%B6%E8%BF%9F">范例 —— Web 服务器可用性和延迟</h3>
<ul>
<li>考察Web服务器<strong>可用性</strong>：成功请求数与请求总数的比率
<ul>
<li>100个请求成功80个，可用性80%</li>
</ul>
</li>
<li>考察Web<strong>服务延迟</strong>：阈值时间内完成的操作比率
<ul>
<li>10ms内返回80个，延迟满足率80%</li>
</ul>
</li>
</ul>
<p>Source: <a href="https://docs.microsoft.com/zh-cn/learn/modules/improve-reliability-monitoring/7-sli-slo">服务级别指标(SLI)和服务级别目标(SLO)示例</a></p>

<ul>
<li>QoS 保障的核心：在共享环境中满足每个租户的 SLO</li>

<li>难点二：<strong>SLO 违约</strong>——归因分解与错误预算管理</li>

<h3 id="bfq-%E5%8E%9F%E7%90%86">BFQ 原理</h3>

<ul>
<li><strong>预算公平</strong>：为每个 I/O 进程分配时间预算</li>
<li><strong>权重分配</strong>：按 cgroup 权重比例分配带宽</li>
<li><strong>低延迟保证</strong>：交互式请求优先调度</li>
<li><strong>局限</strong>：公平 ≠ 满足 SLO——权重相等不保证延迟相等</li>
</ul>
</section>

<p>Source: <a href="https://www.usenix.org/legacy/events/osdi10/tech/">mClock, OSDI'10</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-marpit-scope-jCnoRdjT="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="30" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="86">
<h3 id="mclock-%E5%8E%9F%E7%90%86">mClock 原理</h3>

<ul>
<li><strong>预留</strong>：每个客户端获得最低 IOPS 保证</li>
<li><strong>权重</strong>：超出预留部分按权重比例分配</li>
<li><strong>上限</strong>：限制客户端最大资源使用</li>
<li><strong>分布式扩展</strong>：dmclock 跨节点协调</li>
<li><strong>局限</strong>：参数静态配置，无法动态适应负载变化</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-marpit-scope-wbS0ZuYi="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="86">
<h3 id="%E9%9D%99%E6%80%81%E5%88%86%E9%85%8D%E7%9A%84%E5%9B%B0%E5%A2%83">静态分配的困境</h3>

<ul>
<li>公平 ≠ 满足 SLO：权重相等不保证延迟达标</li>
<li>静态阈值无法应对动态负载</li>
<li>过度保守 → 资源浪费；过度激进 → SLO 违约</li>
<li><strong>核心矛盾</strong>：需要<strong>预测</strong>负载才能做出正确的资源决策</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-marpit-scope-K7HaVG5g="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="32" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="86">
<h3 id="%E5%B0%8F%E7%BB%93%E6%8C%91%E6%88%98%E4%B8%80%E5%BD%92%E7%BA%B3">小结：挑战一归纳</h3>

<ul>
<li>性能干扰<strong>不可完全消除</strong>——多租户共享是云的本质</li>
<li>经典机制提供<strong>公平性</strong>，但不保证 <strong>SLO 合规</strong></li>
<li>从被动隔离到主动调控：<strong>需要预测</strong>负载与性能</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-marpit-scope-CT27feKO="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="86">
<h2 id="%E6%8C%91%E6%88%98%E4%BA%8Cslo-%E8%BF%9D%E7%BA%A6%E4%B8%8E%E9%94%99%E8%AF%AF%E9%A2%84%E7%AE%97">挑战二：SLO 违约与错误预算</h2>

<p>SLO 违约的归因与预算</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-marpit-scope-H8MfCdaJ="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="34" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="86">
<h3 id="%E5%9B%9E%E6%8C%87%E9%95%BF%E5%B0%BE%E7%8E%B0%E8%B1%A1%E7%9A%84%E4%B8%89%E6%9D%A1%E7%BB%93%E8%AE%BA">回指：长尾现象的三条结论</h3>

<ol>
<li><strong>规模是小概率事件的放大器</strong>——组件越多，遇上慢组件的概率越高</li>
<li><strong>平均值掩盖尾部</strong>——均值正常不代表用户体验正常</li>
<li><strong>百分位才是有意义的承诺</strong>——P99 / P999 而非 mean</li>
</ol>
<p>本讲不再重复现象成因，而是回答下一个问题：<br />
<strong>承诺了 P99，违约了怎么办？</strong></p>
<blockquote>
<p>长尾的产生机理、经典应对（容错/容滞/对冲/关联请求）与工业案例，详见《对象存储》挑战二</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-marpit-scope-EmSxY96J="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="35" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="86">
<h3 id="slo-%E8%BF%9D%E7%BA%A6%E7%9A%84%E4%B8%89%E7%B1%BB%E6%88%90%E5%9B%A0">SLO 违约的三类成因</h3>

<table>
<thead>
<tr>
<th>类型</th>
<th>触发源</th>
<th>时间特征</th>
<th>典型场景</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>干扰型</strong></td>
<td>邻居租户抢占共享资源</td>
<td>与邻居负载同步</td>
<td>吵闹邻居、突发批处理</td>
</tr>
<tr>
<td><strong>波动型</strong></td>
<td>设备自身状态变化</td>
<td>周期性 / 阶跃</td>
<td>SSD 垃圾回收、磨损均衡、副本重构</td>
</tr>
<tr>
<td><strong>排队型</strong></td>
<td>本租户负载超出配额</td>
<td>与自身负载同步</td>
<td>流量峰值、队头阻塞</td>
</tr>
</tbody>
</table>
<p>违约不是一种病，是<strong>三种病共用一个症状</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-marpit-scope-KjRT9EBb="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="36" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="86">
<h3 id="%E4%B8%BA%E4%BB%80%E4%B9%88%E8%A6%81%E5%81%9A%E6%88%90%E5%9B%A0%E5%88%86%E8%A7%A3">为什么要做成因分解</h3>

<table>
<thead>
<tr>
<th>成因</th>
<th>对应治理手段</th>
<th>归错因的后果</th>
</tr>
</thead>
<tbody>
<tr>
<td>干扰型</td>
<td>隔离与配额（挑战一的机制）</td>
<td>误加自身限流 → 白白降低吞吐</td>
</tr>
<tr>
<td>波动型</td>
<td>冗余、对冲、<strong>设备状态预测</strong></td>
<td>误判为邻居干扰 → 无谓迁移租户</td>
</tr>
<tr>
<td>排队型</td>
<td>准入控制、调度优先级</td>
<td>误判为设备故障 → 触发无效重构</td>
</tr>
</tbody>
</table>
<p><strong>归错因则治错病</strong>——这是把 SLO 从&quot;监控指标&quot;变成&quot;可执行调控&quot;的第一步</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-marpit-scope-9vuTt8iK="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="37" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="86">
<h3 id="%E5%A4%9A%E7%A7%9F%E6%88%B7%E4%B8%8B%E7%9A%84%E5%B0%BE%E5%BB%B6%E8%BF%9F%E5%8F%A0%E5%8A%A0">多租户下的尾延迟叠加</h3>

<p>租户 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>i</mi></mrow><annotation encoding="application/x-tex">i</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6595em;"></span><span class="mord mathnormal">i</span></span></span></span> 只要有<strong>任一邻居</strong>处于突发态，就可能被拖累：</p>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>P</mi><mi>i</mi></msub><mo stretchy="false">(</mo><mtext>违约</mtext><mo stretchy="false">)</mo><mo>=</mo><mn>1</mn><mo>−</mo><munder><mo>∏</mo><mrow><mi>j</mi><mo mathvariant="normal">≠</mo><mi>i</mi></mrow></munder><mrow><mo fence="true">(</mo><mn>1</mn><mo>−</mo><msub><mi>p</mi><mi>j</mi></msub><mo fence="true">)</mo></mrow></mrow><annotation encoding="application/x-tex">P_i(\text{违约}) = 1 - \prod_{j \neq i}\left(1 - p_j\right)
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.13889em;">P</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">i</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mopen">(</span><span class="mord text"><span class="mord cjk_fallback">违约</span></span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">1</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:2.4882em;vertical-align:-1.4382em;"></span><span class="mop op-limits"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1.05em;"><span style="top:-1.8479em;margin-left:0em;"><span class="pstrut" style="height:3.05em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight" style="margin-right:0.05724em;">j</span><span class="mrel mtight"><span class="mrel mtight"><span class="mord vbox mtight"><span class="thinbox mtight"><span class="rlap mtight"><span class="strut" style="height:0.8889em;vertical-align:-0.1944em;"></span><span class="inner"><span class="mord mtight"><span class="mrel mtight"></span></span></span><span class="fix"></span></span></span></span></span><span class="mrel mtight">=</span></span><span class="mord mathnormal mtight">i</span></span></span></span><span style="top:-3.05em;"><span class="pstrut" style="height:3.05em;"></span><span><span class="mop op-symbol large-op">∏</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:1.4382em;"><span></span></span></span></span></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="minner"><span class="mopen delimcenter" style="top:0em;">(</span><span class="mord">1</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mord"><span class="mord mathnormal">p</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.05724em;">j</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2861em;"><span></span></span></span></span></span></span><span class="mclose delimcenter" style="top:0em;">)</span></span></span></span></span></span></p><table>
<thead>
<tr>
<th style="text-align:center">共享租户数 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>N</mi></mrow><annotation encoding="application/x-tex">N</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.10903em;">N</span></span></span></span></th>
<th style="text-align:center">单租户突发概率 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>p</mi><mo>=</mo><mn>2</mn><mi mathvariant="normal">%</mi></mrow><annotation encoding="application/x-tex">p=2\%</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord mathnormal">p</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.8056em;vertical-align:-0.0556em;"></span><span class="mord">2%</span></span></span></span></th>
<th style="text-align:center">违约概率</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:center">4</td>
<td style="text-align:center">2%</td>
<td style="text-align:center">5.9%</td>
</tr>
<tr>
<td style="text-align:center">8</td>
<td style="text-align:center">2%</td>
<td style="text-align:center">13.2%</td>
</tr>
<tr>
<td style="text-align:center">32</td>
<td style="text-align:center">2%</td>
<td style="text-align:center">46.6%</td>
</tr>
</tbody>
</table>
<p><strong>与《对象存储》的区别</strong>：那里是一个请求<strong>扇出</strong>到 100 台服务器（fan-out）；这里是 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>N</mi></mrow><annotation encoding="application/x-tex">N</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.10903em;">N</span></span></span></span> 个租户<strong>扇入</strong>同一台设备（fan-in）。同样的代数，相反的拓扑。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-marpit-scope-CaSKW6L7="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="38" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="86">
<h3 id="%E9%94%99%E8%AF%AF%E9%A2%84%E7%AE%97-error-budget">错误预算 Error Budget</h3>

<p>SLO 的补集不是&quot;失败&quot;，而是一笔<strong>可以花的预算</strong>：</p>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mtext>Error Budget</mtext><mo>=</mo><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mtext>SLO</mtext><mo stretchy="false">)</mo><mo>×</mo><mtext>统计窗口</mtext></mrow><annotation encoding="application/x-tex">\text{Error Budget} = (1 - \text{SLO}) \times \text{统计窗口}
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8889em;vertical-align:-0.1944em;"></span><span class="mord text"><span class="mord">Error Budget</span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">(</span><span class="mord">1</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord text"><span class="mord">SLO</span></span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord text"><span class="mord cjk_fallback">统计窗口</span></span></span></span></span></span></p><table>
<thead>
<tr>
<th style="text-align:center">SLO</th>
<th style="text-align:left">30 天窗口内的违约额度</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:center">99%</td>
<td style="text-align:left">7 小时 12 分</td>
</tr>
<tr>
<td style="text-align:center"><strong>99.9%</strong></td>
<td style="text-align:left"><strong>43.2 分钟</strong></td>
</tr>
<tr>
<td style="text-align:center">99.99%</td>
<td style="text-align:left">4.32 分钟</td>
</tr>
<tr>
<td style="text-align:center">99.999%</td>
<td style="text-align:left">25.9 秒</td>
</tr>
</tbody>
</table>
<p>思路转变：从&quot;<strong>不许违约</strong>&quot;到&quot;<strong>违约是可管理的预算</strong>&quot;——预算没花完，就可以拿去换升级、换成本、换新特性</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-marpit-scope-9pkP4xyT="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="39" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="86">
<h3 id="%E9%94%99%E8%AF%AF%E9%A2%84%E7%AE%97%E7%9A%84%E5%88%86%E9%85%8D%E4%B8%8E%E6%B6%88%E8%80%97">错误预算的分配与消耗</h3>

<p><strong>燃尽速率</strong>：<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mtext>burn rate</mtext><mo>=</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mtext>实测违约率</mtext><mrow><mn>1</mn><mo>−</mo><mtext>SLO</mtext></mrow></mfrac></mstyle></mrow><annotation encoding="application/x-tex">\text{burn rate} = \dfrac{\text{实测违约率}}{1 - \text{SLO}}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6944em;"></span><span class="mord text"><span class="mord">burn rate</span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:2.1297em;vertical-align:-0.7693em;"></span><span class="mord"><span class="mopen nulldelimiter"></span><span class="mfrac"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1.3603em;"><span style="top:-2.314em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord">1</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mord text"><span class="mord">SLO</span></span></span></span><span style="top:-3.23em;"><span class="pstrut" style="height:3em;"></span><span class="frac-line" style="border-bottom-width:0.04em;"></span></span><span style="top:-3.677em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord text"><span class="mord cjk_fallback">实测违约率</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.7693em;"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span></span></span></span>，为 1 时预算恰好在窗口末尾用尽</p>
<table>
<thead>
<tr>
<th style="text-align:center">燃尽速率</th>
<th style="text-align:center">观测窗口</th>
<th style="text-align:center">消耗预算</th>
<th style="text-align:left">告警级别</th>
</tr>
</thead>
<tbody>
<tr>

<h3 id="%E5%AF%B9%E5%86%B2%E8%AF%B7%E6%B1%82%E7%9A%84%E5%8F%8D%E5%99%AC">对冲请求的反噬</h3>

<p>《对象存储》给出的经典解法——<strong>对冲请求</strong>（P95 未返回则发副本请求）——在多租户下会<strong>反噬</strong>：</p>
<ul>
<li>对冲请求消耗的是<strong>共享设备的真实 IOPS</strong>，不是免费的</li>
<li>触发时机恰是设备最拥塞时 → 边际代价远高于名义的 5% 额外请求量</li>
<li>本质是<strong>拿 B 租户的预算补 A 租户</strong>——A 的 P99 改善了，B 的错误预算被悄悄花掉</li>
<li>正反馈风险：拥塞 → 对冲 → 负载升高 → 更拥塞（<strong>对冲风暴</strong>）</li>
</ul>
<p><strong>多租户下的修正</strong>：为对冲设置<strong>每租户配额</strong>，并将跨租户对冲的开销<strong>计入发起方的错误预算</strong></p>
<blockquote>
<p>单机视角的最优解，在多租户视角下可能是负和博弈——这是方法层必须重新审视现象层结论的原因</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-marpit-scope-Q80QucNs="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="41" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="86">
<h3 id="mittos%E6%AF%AB%E7%A7%92%E7%BA%A7%E5%B0%BE%E5%BB%B6%E8%BF%9F%E5%AE%B9%E5%BF%8D">MittOS：毫秒级尾延迟容忍</h3>

<ul>
<li><a href="https://dl.acm.org/doi/10.1145/3132747.3132774">MittOS: Supporting Millisecond Tail Tolerance with Fast Rejecting SLO-Aware OS Interface</a>, SOSP 2017</li>
<li>核心思想：<strong>快速拒绝</strong>——当系统无法在 SLO 内完成时，立即返回错误</li>
<li>应用端可通过重试或降级处理，而非等待超时</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-marpit-scope-2PsDa3IO="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="42" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="86">
<h3 id="%E5%B0%8F%E7%BB%93%E4%BB%8E%E8%A2%AB%E5%8A%A8%E5%AE%B9%E6%BB%9E%E5%88%B0%E4%B8%BB%E5%8A%A8%E8%B0%83%E6%8E%A7">小结：从被动容滞到主动调控</h3>

<ul>
<li>违约有<strong>三类成因</strong>，归错因则治错病</li>
<li>错误预算把 SLO 从<strong>布尔判定</strong>变成<strong>可分配的资源</strong></li>
<li>三类成因的治理都指向同一个前提：<strong>提前知道会违约</strong>
<ul>
<li>干扰型 → 预测邻居负载 | 波动型 → 预测设备状态 | 排队型 → 预测自身流量</li>
</ul>
</li>
</ul>
<p>事后容滞的天花板已经触到了——下一步必须<strong>预测</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-marpit-scope-SQJr0G5E="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="43" style="--paginate:true;--theme:gaia;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="86" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;images/QoS-managed-distributed-storage-system.gif&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="43" data-marpit-scope-SQJr0G5E="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="43" style="--paginate:true;--theme:gaia;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="86" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">

<p><img src="images/PI-Controller.png" alt="" style="height:300px;" /></p>
<ul>
<li><strong>比例 (P)</strong>：当前误差 × 增益 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>K</mi><mi>p</mi></msub></mrow><annotation encoding="application/x-tex">K_p</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.9694em;vertical-align:-0.2861em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.07153em;">K</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:-0.0715em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">p</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2861em;"><span></span></span></span></span></span></span></span></span></span>，快速响应</li>
<li><strong>积分 (I)</strong>：累积误差 × 增益 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>K</mi><mi>i</mi></msub></mrow><annotation encoding="application/x-tex">K_i</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.07153em;">K</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:-0.0715em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">i</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span>，消除稳态误差</li>
<li>用于延迟调控：设定 SLO → 测量实际延迟 → PI 计算资源调整量</li>
</ul>
<p>Source: <a href="https://blog.opticontrols.com/archives/344">PID Controllers Explained</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-marpit-scope-hxYnb7xV="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="49" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="86">
<h3 id="pslo-%E6%96%B9%E6%B3%95-eurosys16">PSLO 方法 (EuroSys'16)</h3>

<ul>
<li><a href="https://dl.acm.org/doi/10.1145/2901318.2901330">PSLO: enforcing the Xth percentile latency and throughput SLOs for consolidated VM storage</a></li>
<li><strong>目标</strong>：强制执行 Xth 百分位延迟与吞吐 SLO</li>
<li><strong>方法</strong>：
<ul>
<li>PI 控制器监控百分位延迟</li>
<li>动态调整 VM 存储资源配额</li>
<li>合并多 VM 的 SLO 约束</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-marpit-scope-nw7F235v="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="50" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="86">
<h3 id="pslo-%E6%95%88%E6%9E%9C">PSLO 效果</h3>

<ul>
<li>合并 VM 存储后，<strong>百分位延迟 SLO 得到强制执行</strong></li>
<li>吞吐 SLO 同时满足，控制器收敛快、稳态误差小</li>
<li><strong>这个结果说明了什么</strong>：只要能建出可控模型，百分位延迟这种<strong>统计量</strong>也能被闭环控制——控制论并非只适用于均值</li>
</ul>
<blockquote>
<p>PSLO 在课题组研究脉络中的位置，见后文「我们的工作」（EuroSys'16 作为演进线起点；此处为控制论方法代表案例，完整讲解不重复）</p>
</blockquote>
<p>反过来，它也划出了这条路线的边界：模型一旦不准，控制器就失灵</p>
<blockquote>
<p>该工作在课题组研究脉络中的位置，见后文「我们的工作」</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-marpit-scope-G1zz0hOU="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="51" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="86">
<h3 id="%E6%8E%A7%E5%88%B6%E8%AE%BA%E6%96%B9%E6%B3%95%E5%B0%8F%E7%BB%93">控制论方法小结</h3>

<ul>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/> <strong>优点</strong>：理论保证（稳定性、收敛性可证明）</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/> <strong>优点</strong>：在线计算开销小</li>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/274c.svg" data-marp-twemoji=""/> <strong>局限</strong>：依赖精确的系统模型</li>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/274c.svg" data-marp-twemoji=""/> <strong>局限</strong>：对非线性、突发性负载响应慢</li>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/274c.svg" data-marp-twemoji=""/> <strong>局限</strong>：多变量耦合时控制器设计复杂</li>
</ul>
</section>

<h3 id="%E6%96%B9%E6%B3%95%E4%BA%8C%E7%BA%A6%E6%9D%9F%E4%BC%98%E5%8C%96">方法二：约束优化</h3>

<p><img src="images/constrained-optimization-l.jpg" alt="" style="height:450px;" /></p>
<p>将 QoS 保障建模为优化问题：目标函数 + SLO 约束 + 资源约束</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-marpit-scope-aT4ukHeR="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="53" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="86">

"sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight" style="margin-right:0.05764em;">S</span><span class="mord mathnormal mtight">L</span><span class="mord mathnormal mtight" style="margin-right:0.02778em;">O</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.247em;"><span></span></span></span></span></span></span><span class="mpunct">,</span><span class="mspace"> </span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">∀</span><span class="mord mathnormal">i</span><span class="mpunct">;</span><span class="mspace" style="margin-right:1em;"></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mop op-limits"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1.05em;"><span style="top:-1.8723em;margin-left:0em;"><span class="pstrut" style="height:3.05em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">i</span></span></span><span style="top:-3.05em;"><span class="pstrut" style="height:3.05em;"></span><span><span class="mop op-symbol large-op">∑</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:1.2777em;"><span></span></span></span></span></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.02778em;">r</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:-0.0278em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">i</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">≤</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.00773em;">R</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3361em;"><span style="top:-2.55em;margin-left:-0.0077em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">t</span><span class="mord mathnormal mtight">o</span><span class="mord mathnormal mtight">t</span><span class="mord mathnormal mtight">a</span><span class="mord mathnormal mtight" style="margin-right:0.01968em;">l</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span></span></p><ul>
<li><strong>目标</strong>：最大化加权 QoS 满足度</li>
<li><strong>约束1</strong>：每个租户延迟不超过 SLO</li>
<li><strong>约束2</strong>：资源分配总量不超过系统容量</li>
<li><strong>求解</strong>：线性规划 / 整数规划 / 启发式</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-marpit-scope-Ntdu4Wja="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="54" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="86">
<h3 id="cofs-%E6%96%B9%E6%A1%88-tcad24">CoFS 方案 (TCAD'24)</h3>

<ul>
<li><a href="https://ieeexplore.ieee.org/document/10247718">CoFS: NVMe SSD 协作感知公平性方案</a></li>
<li><strong>观察</strong>：多租户 NVMe SSD 上，租户间存在协作机会</li>
<li><strong>方法</strong>：
<ul>
<li>识别租户 I/O 模式的协作性</li>
<li>将公平性约束嵌入优化模型</li>
<li>NVMe 多队列调度实现协作感知分配</li>
</ul>
</li>
<li><strong>在 M2 视角</strong>：作为&quot;约束优化&quot;方法的代表——SLO 约束 → 全局最优</li>
<li><strong>M3 设备层视角</strong>：CoFS 的 NVMe 队列协作感知调度机制将在 M3《闪存存储系统设计》中展开</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-marpit-scope-sgla3PQO="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="55" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="86">
<h3 id="cofs-%E6%95%88%E6%9E%9C">CoFS 效果</h3>

<ul>
<li>多租户 SLO 合规率显著提升</li>
<li>公平性指数（Jain's Index）改善</li>
<li>对比静态分配：吞吐不降反升——协作感知释放了并行潜力</li>
<li><strong>系统层视角</strong>：约束优化在分布式存储 QoS 中的应用范例</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-marpit-scope-aFEUE52m="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="56" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="86">
<h3 id="%E7%BA%A6%E6%9D%9F%E4%BC%98%E5%8C%96%E6%96%B9%E6%B3%95%E5%B0%8F%E7%BB%93">约束优化方法小结</h3>

<ul>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/> <strong>优点</strong>：全局最优解（理论上）</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/> <strong>优点</strong>：可同时处理多约束</li>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/274c.svg" data-marp-twemoji=""/> <strong>局限</strong>：求解开销随规模增长</li>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/274c.svg" data-marp-twemoji=""/> <strong>局限</strong>：模型精度依赖系统建模</li>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/274c.svg" data-marp-twemoji=""/> <strong>局限</strong>：实时性要求高时需近似求解</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-marpit-scope-2AwBzynE="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="57" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="86">
<h3 id="%E6%96%B9%E6%B3%95%E4%B8%89%E6%9C%BA%E5%99%A8%E5%AD%A6%E4%B9%A0">方法三：机器学习</h3>

<p><img src="images/reinforcement-Learning.svg" alt="" style="width:1150px;" /></p>
<p>从&quot;反应式&quot;到&quot;预测式&quot;：用数据驱动方法学习系统行为</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-marpit-scope-ZoAjHZVu="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="58" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="86">
<h3 id="%E4%B8%BA%E4%BB%80%E4%B9%88-ml">为什么 ML？</h3>

<ul>
<li><strong>非线性系统建模</strong>：真实存储系统不是简单队列</li>
<li><strong>负载特征学习</strong>：自动提取时序模式与相关性</li>
<li><strong>自适应能力</strong>：模型随环境变化在线更新</li>
<li><strong>多变量耦合</strong>：高维输入无需手动建模</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-marpit-scope-FY5D9bIa="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="59" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="86">
<h3 id="%E6%8E%92%E9%98%9F%E8%AE%BA%E7%9A%84%E9%80%82%E7%94%A8%E8%BE%B9%E7%95%8C">排队论的适用边界</h3>

<p>排队论能给出延迟分布的解析解，但 M/M/1 的三条假设在真实系统都会破：</p>
<table>
<thead>
<tr>
<th>假设</th>
<th>真实系统的偏离</th>
<th>后果</th>
</tr>
</thead>
<tbody>
<tr>
<td>到达服从<strong>泊松过程</strong></td>
<td>请求成批到达、存在自相关</td>
<td>低估队列长度与尾部</td>
</tr>
<tr>
<td>服务时间服从<strong>指数分布</strong></td>
<td>SSD 有 GC 停顿，服务时间<strong>双峰</strong></td>
<td>尾部预测严重偏低</td>
</tr>
<tr>
<td><strong>单队列单服务台</strong></td>
<td>多副本、多磁盘、多级缓存并联</td>
<td>需逐一手工建模，扩展性差</td>
</tr>
</tbody>
</table>
<p>假设越贴近真实，模型越难解析求解——这正是<strong>机器学习方法</strong>的切入点</p>
<blockquote>
<p>排队论建模的完整推导（联合操作抽象、accept() 等待时间建模、4.44% 平均误差）详见《对象存储》挑战三</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-marpit-scope-qdvh8vG9="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="60" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="86">
<h3 id="%E6%9C%BA%E5%99%A8%E5%AD%A6%E4%B9%A0%E6%96%B9%E6%B3%95%E4%BB%8E%E7%89%B9%E5%BE%81%E5%B7%A5%E7%A8%8B%E5%88%B0%E5%9B%BE%E5%AD%A6%E4%B9%A0">机器学习方法：从特征工程到图学习</h3>

<table>
<thead>
<tr>
<th>代际</th>
<th>输入表示</th>
<th>能捕捉的关系</th>
<th>局限</th>
</tr>
</thead>
<tbody>
<tr>
<td>特征工程 + 回归</td>
<td>手工统计量向量</td>
<td>单点相关</td>
<td>依赖专家先验，丢失结构</td>
</tr>
<tr>
<td>时序模型（RNN/LSTM）</td>
<td>指标时间序列</td>
<td><strong>时间</strong>依赖</td>
<td>忽略组件间拓扑</td>
</tr>
<tr>
<td>图神经网络</td>
<td>组件拓扑图</td>
<td><strong>空间</strong>依赖</td>
<td>忽略动态演化</td>
</tr>
<tr>
<td><strong>时序图</strong></td>
<td>拓扑 + 时间双维</td>
<td>空间 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>×</mo></mrow><annotation encoding="application/x-tex">\times</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6667em;vertical-align:-0.0833em;"></span><span class="mord">×</span></span></span></span> 时间</td>
<td>训练与推理开销高</td>
</tr>
</tbody>
</table>
<p><strong>时序图的抽象</strong>：节点 = 存储组件（OSD / 磁盘 / 缓存），边 = 数据通路与依赖，节点属性随时间演化 = 负载与延迟</p>
<p>尾延迟的成因往往是<strong>某个组件在某个时刻</strong>变慢并沿数据通路传播——这恰是时序图能表达而前三代不能的</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-marpit-scope-NKYM8PJl="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="61" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="86">

<ul>
<li><a href="https://dl.acm.org/doi/10.1145/2998454">Customizable SLO and Its Near-Precise Enforcement for Storage Bandwidth</a></li>
<li><strong>贡献</strong>：可定制 SLO 语义 + 近精确执行</li>
<li><strong>突破</strong>：从固定 SLO 到用户自定义 SLO 形态</li>

<h3 id="%E5%BB%B6%E8%BF%9F%E5%88%86%E5%B8%83%E9%A2%84%E6%B5%8B-icpp17--jpdc19">延迟分布预测 (ICPP'17 + JPDC'19)</h3>

<ul>
<li><a href="https://ieeexplore.ieee.org/document/8025298">Predicting Response Latency Percentiles, ICPP 2017</a></li>
<li><a href="http://www.sciencedirect.com/science/article/pii/S0743731518301175">Understanding the latency distribution, JPDC 2019</a></li>
<li><strong>贡献</strong>：云对象存储延迟分布建模与百分位预测</li>
<li><strong>关键创新</strong>：联合操作抽象 + accept() 等待建模</li>
<li><strong>效果</strong>：平均误差 4.44%，最坏 16.61%</li>
<li><strong>在演进线中的位置</strong>：解析建模的<strong>高峰</strong>，也是其<strong>边界</strong>——假设一旦放宽便不可解，由此转向机器学习</li>

<table>
<thead>
<tr>
<th>年份</th>
<th>工作</th>
<th>设备层问题</th>
<th>与系统层的对应</th>
</tr>
</thead>
<tbody>
<tr>
<td>2022</td>
<td>多因子缓存替换 (ICCD)</td>
<td>缓存该淘汰谁</td>
<td>对应系统层的负载预测</td>
</tr>
<tr>
<td>2023</td>
<td>Fair Will Go On (DAC)</td>
<td>并行度与公平性冲突</td>
<td>对应系统层的配额分配</td>
</tr>
<tr>
<td>2024</td>
<td>CoFS (TCAD)</td>
<td>NVMe 协作感知调度</td>
<td>对应系统层的约束优化</td>
</tr>
</tbody>
</table>
<p><strong>一体两面</strong>：系统层用预测<strong>保障 SLO</strong>，设备层用预测<strong>优化 SSD</strong>——同一套预测思想，作用在不同的抽象层</p>
<blockquote>
<p>三项工作的完整方法与实验，详见专题讲座《闪存存储系统设计：从介质特性到服务质量》</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-marpit-scope-aXvIrkPQ="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="74" style="--paginate:true;--theme:gaia;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="86" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;images/sc23-bg1.png&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="74" data-marpit-scope-aXvIrkPQ="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="74" style="--paginate:true;--theme:gaia;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="86" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="graph3po-sc23">Graph3PO (SC'23)</h3>

<ul>
<li><a href="https://dl.acm.org/doi/10.1145/3581784.3607075">Graph3PO: A Temporal Graph Data Processing Method</a>, SC 2023</li>
<li><strong>贡献</strong>：时序图数据处理方法预测延迟 QoS</li>
<li><strong>突破</strong>：从排队论到图学习——捕捉空间相关性与时间动态性</li>
<li><strong>效果</strong>：对象云存储尾延迟预测精度显著提升</li>
</ul>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-marpit-scope-aXvIrkPQ="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="74" style="" data-marpit-pagination-total="86" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="75" data-marpit-scope-98tzSTeh="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="75" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="86">
<h3 id="graph3po-%E6%97%B6%E5%BA%8F%E5%9B%BE%E5%BB%BA%E6%A8%A1">Graph3PO 时序图建模</h3>

<p><img src="images/sc23-bg2.png" alt="" style="width:900px;" /></p>
<p>节点 = 存储组件，边 = 数据通路，时序特征 = 请求到达与处理延迟</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="76" data-marpit-scope-1LNnj2Fi="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="76" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="86">
<h3 id="spfaas-tpds25">SPFaaS (TPDS'25)</h3>

<ul>
<li><a href="https://ieeexplore.ieee.org/xpl/RecentIssue.jsp?punumber=71">SPFaaS: Sparse Function Prediction as a Service</a>, IEEE TPDS 2025</li>
<li><strong>贡献</strong>：稀疏函数预测——冷启动优化与用户满意度保障</li>
<li><strong>方法</strong>：序列预测模型预判函数调用模式</li>
<li><strong>意义</strong>：将预测方法从存储 QoS 扩展到 Serverless 场景</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="77" data-marpit-scope-HEq62yih="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="77" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="86">
<h3 id="stgraph3po-taco26">STGraph3PO (TACO'26)</h3>

<ul>
<li>STGraph3PO: Spatio-Temporal Graph Prediction, ACM TACO 2026</li>
<li><strong>贡献</strong>：时空图预测——Graph3PO 的升级版</li>
<li><strong>突破</strong>：从时序图到时空图，覆盖异构对象存储</li>
<li><strong>效果</strong>：异构环境下 QoS 保障精度进一步提升</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="78" data-marpit-scope-b38sdCSY="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="78" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="86">
<h3 id="kgqw-tpds26">KGQW (TPDS'26)</h3>

<ul>
<li>KGQW: Knowledge Graph Query Workload Tuning, IEEE TPDS 2026</li>
<li><strong>贡献</strong>：知识图谱查询辅助分布式存储参数调优</li>
<li><strong>展望定位</strong>：从数据驱动到知识驱动的 QoS 保障</li>
<li><strong>意义</strong>：探索&quot;知识增强&quot;的预测与优化新范式</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="79" data-marpit-scope-kceEM1BL="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="79" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="86">
<h3 id="%E6%BC%94%E8%BF%9B%E5%BD%92%E7%BA%B3">演进归纳</h3>

<p>方法论演进线：<strong>控制论 → 约束优化 → 机器学习 → 图预测 → 知识图谱</strong></p>
<ul>
<li>2016-2019：控制论与优化奠基</li>
<li>2019-2023：排队论与图学习突破</li>
<li>2024-2026：异构场景与知识驱动展望</li>
</ul>
<p>一以贯之：<strong>用预测方法保障存储系统服务质量</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="80" data-marpit-scope-IH4VkW4n="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="80" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="86">
<h2 id="%E8%AF%BE%E5%A0%82%E6%BC%94%E7%A4%BA%E4%B8%8E%E5%AE%9E%E9%AA%8C">课堂演示与实验</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="81" data-marpit-scope-oYx2ggGf="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="81" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="86">

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="82" data-marpit-scope-exE7OEsu="" data-paginate="true" data-theme="gaia" lang="en-US" data-marpit-pagination="82" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="86">
<h3 id="%E5%AE%9E%E9%AA%8C%E6%80%9D%E8%B7%AF">实验思路</h3>

</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">with</span> ThreadPoolExecutor(max_workers=<span class="hljs-number">1</span>) <span class="hljs-keyword">as</span> executor:

<p>A) 移动平均（MA）　　B) ARIMA　　C) 机器学习（Graph3PO）</p>

<ul>
<li>课前预置：conda 环境 + 数据集 + 基准结果</li>
<li>3 段 × 15 min：
<ul>
<li>① 性能干扰观测（调节并发数 → 观察延迟变化）</li>
<li>② 尾延迟测量（P50/P95/P99 对比）</li>
<li>③ 预测方法对比（MA vs ML 模型）</li>
</ul>
</li>
<li>每段后 5 min POE 讨论</li>
</ul>
</section>

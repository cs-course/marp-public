<h1 id="%E8%BD%AF%E4%BB%B6%E6%8A%80%E6%9C%AF%E5%9F%BA%E7%A1%80">软件技术基础</h1>

<p><strong>施展</strong><br />

华中科技大学</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="2" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="33">
<h2 id="%E4%B8%BB%E8%A6%81%E5%86%85%E5%AE%B9">主要内容</h2>
<ul>
<li>字符集和标识符</li>
<li>数据类型</li>
<li>常量与变量</li>
<li>运算符和表达式</li>
<li>位运算</li>
<li>类型转换</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-marpit-scope-lWuiyZMQ="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="3" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="33">
<h2 id="%E5%AD%97%E7%AC%A6%E9%9B%86">字符集</h2>

<p>C 语言的字符集包括：</p>
<ul>
<li><strong>字母</strong>：<code>a</code>~<code>z</code>、<code>A</code>~<code>Z</code></li>
<li><strong>数字</strong>：<code>0</code>~<code>9</code></li>
<li><strong>特殊符号</strong>：<code>+ - * / = &lt; &gt; ! &amp; | ^ ~ # ' &quot; ; : , . ? \ ( ) [ ] { }</code></li>
<li><strong>空白符</strong>：空格、制表符 <code>\t</code>、换行符 <code>\n</code>、回车 <code>\r</code>、换页 <code>\f</code></li>
<li><strong>转义字符</strong>：以 <code>\</code> 开头的特殊字符序列</li>
</ul>
<table>
<thead>
<tr>
<th style="text-align:center">转义字符</th>
<th style="text-align:left">含义</th>
<th style="text-align:center">ASCII</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:center"><code>\n</code></td>
<td style="text-align:left">换行</td>
<td style="text-align:center">10</td>
</tr>
<tr>
<td style="text-align:center"><code>\t</code></td>
<td style="text-align:left">水平制表</td>
<td style="text-align:center">9</td>
</tr>
<tr>
<td style="text-align:center"><code>\\</code></td>
<td style="text-align:left">反斜杠</td>
<td style="text-align:center">92</td>
</tr>
<tr>
<td style="text-align:center"><code>\'</code></td>
<td style="text-align:left">单引号</td>
<td style="text-align:center">39</td>
</tr>
<tr>
<td style="text-align:center"><code>\&quot;</code></td>
<td style="text-align:left">双引号</td>
<td style="text-align:center">34</td>
</tr>
<tr>
<td style="text-align:center"><code>\0</code></td>
<td style="text-align:left">空字符</td>
<td style="text-align:center">0</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-marpit-scope-ACjEhK8E="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="4" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="33">
<h2 id="%E6%A0%87%E8%AF%86%E7%AC%A6">标识符</h2>

<p><strong>标识符</strong>：用来命名变量、函数、类型等的符号</p>
<p><strong>命名规则</strong>：</p>
<ul>
<li>只能由<strong>字母</strong>、<strong>数字</strong>和<strong>下划线</strong>组成</li>
<li>第一个字符必须是<strong>字母</strong>或<strong>下划线</strong></li>
<li>不能使用<strong>关键字</strong>作为标识符</li>
<li>区分大小写（<code>count</code> ≠ <code>Count</code>）</li>
</ul>
<p><strong>合法示例</strong>：<code>score</code>、<code>student_name</code>、<code>_count</code>、<code>MAX_SIZE</code></p>
<p><strong>非法示例</strong>：<code>2nd</code>（数字开头）、<code>my-var</code>（含减号）、<code>int</code>（关键字）</p>
<p><strong>命名风格建议</strong>：</p>
<ul>
<li>变量/函数：小写+下划线 <code>student_count</code></li>
<li>常量/宏：全大写 <code>MAX_SIZE</code></li>
<li>避免以 <code>_</code> 或 <code>__</code> 开头（系统保留）</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-marpit-scope-hq6PPYfU="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="5" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="33">
<h2 id="c%E8%AF%AD%E8%A8%80%E5%85%B3%E9%94%AE%E5%AD%97c89-%E5%85%B132%E4%B8%AA">C语言关键字（C89 共32个）</h2>

<table>
<thead>
<tr>
<th style="text-align:left">类别</th>
<th style="text-align:left">关键字</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">数据类型</td>
<td style="text-align:left"><code>int</code> <code>char</code> <code>float</code> <code>double</code> <code>void</code> <code>short</code> <code>long</code> <code>unsigned</code> <code>signed</code></td>
</tr>
<tr>
<td style="text-align:left">构造类型</td>
<td style="text-align:left"><code>struct</code> <code>union</code> <code>enum</code> <code>typedef</code></td>
</tr>
<tr>
<td style="text-align:left">存储类别</td>
<td style="text-align:left"><code>auto</code> <code>static</code> <code>extern</code> <code>register</code></td>
</tr>
<tr>
<td style="text-align:left">控制语句</td>
<td style="text-align:left"><code>if</code> <code>else</code> <code>switch</code> <code>case</code> <code>default</code> <code>for</code> <code>while</code> <code>do</code> <code>break</code> <code>continue</code> <code>goto</code> <code>return</code></td>
</tr>
<tr>
<td style="text-align:left">其他</td>
<td style="text-align:left"><code>const</code> <code>volatile</code> <code>sizeof</code></td>
</tr>
</tbody>
</table>
<blockquote>
<p>C99 新增：<code>inline</code> <code>restrict</code> <code>_Bool</code> <code>_Complex</code> <code>_Imaginary</code><br />
C11 新增：<code>_Alignas</code> <code>_Alignof</code> <code>_Atomic</code> <code>_Generic</code> <code>_Noreturn</code> <code>_Static_assert</code> <code>_Thread_local</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-marpit-scope-cOqKDq5a="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="6" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="33">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="7" style="--paginate:true;--theme:gaia;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="33" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;images/c-basic-types.svg&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="7" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="7" style="--paginate:true;--theme:gaia;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="33" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h2 id="%E6%95%B0%E6%8D%AE%E7%B1%BB%E5%9E%8B%E4%B8%80%E8%A7%88">数据类型一览</h2>

<p>C 的数据类型分为四大类：</p>
<ul>
<li><strong>基本类型</strong>：整型、浮点型、字符型、布尔型</li>
<li><strong>构造类型</strong>：数组、结构、联合、枚举</li>
<li><strong>指针类型</strong>：指向各种数据的地址（第8章详述）</li>
<li><strong>空类型</strong> <code>void</code>：无返回值或空类型</li>
</ul>
<p>后续章节将逐一深入数组、指针、结构等。</p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="7" style="" data-marpit-pagination-total="33" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-marpit-scope-EVa0B6bd="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="8" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="33">
<h2 id="%E6%95%B4%E6%95%B0%E7%B1%BB%E5%9E%8B">整数类型</h2>

<table>
<thead>
<tr>
<th style="text-align:left">类型</th>
<th style="text-align:center">典型字节数</th>
<th style="text-align:left">值域（32位系统）</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><code>char</code></td>
<td style="text-align:center">1</td>
<td style="text-align:left"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>−</mo><mn>128</mn></mrow><annotation encoding="application/x-tex">-128</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">−</span><span class="mord">128</span></span></span></span> ~ <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>127</mn></mrow><annotation encoding="application/x-tex">127</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">127</span></span></span></span> 或 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>0</mn></mrow><annotation encoding="application/x-tex">0</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">0</span></span></span></span> ~ <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>255</mn></mrow><annotation encoding="application/x-tex">255</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">255</span></span></span></span></td>
</tr>
<tr>
<td style="text-align:left"><code>short</code> / <code>short int</code></td>
<td style="text-align:center">2</td>
<td style="text-align:left"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>−</mo><mn>32768</mn></mrow><annotation encoding="application/x-tex">-32768</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">−</span><span class="mord">32768</span></span></span></span> ~ <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>32767</mn></mrow><annotation encoding="application/x-tex">32767</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">32767</span></span></span></span></td>
</tr>
<tr>
<td style="text-align:left"><code>int</code></td>
<td style="text-align:center">4</td>
<td style="text-align:left"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>−</mo><msup><mn>2</mn><mn>31</mn></msup></mrow><annotation encoding="application/x-tex">-2^{31}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8974em;vertical-align:-0.0833em;"></span><span class="mord">−</span><span class="mord"><span class="mord">2</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">31</span></span></span></span></span></span></span></span></span></span></span></span> ~ <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mn>2</mn><mn>31</mn></msup><mo>−</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">2^{31}-1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8974em;vertical-align:-0.0833em;"></span><span class="mord"><span class="mord">2</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">31</span></span></span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">1</span></span></span></span></td>
</tr>
<tr>
<td style="text-align:left"><code>long</code> / <code>long int</code></td>
<td style="text-align:center">4/8</td>
<td style="text-align:left">平台相关</td>
</tr>
<tr>
<td style="text-align:left"><code>long long</code> (C99)</td>
<td style="text-align:center">8</td>
<td style="text-align:left"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>−</mo><msup><mn>2</mn><mn>63</mn></msup></mrow><annotation encoding="application/x-tex">-2^{63}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8974em;vertical-align:-0.0833em;"></span><span class="mord">−</span><span class="mord"><span class="mord">2</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">63</span></span></span></span></span></span></span></span></span></span></span></span> ~ <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mn>2</mn><mn>63</mn></msup><mo>−</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">2^{63}-1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8974em;vertical-align:-0.0833em;"></span><span class="mord"><span class="mord">2</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">63</span></span></span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">1</span></span></span></span></td>
</tr>
</tbody>
</table>
<p>加 <code>unsigned</code>：零和正数范围翻倍</p>
<table>
<thead>
<tr>
<th style="text-align:left">类型</th>
<th style="text-align:left">值域</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><code>unsigned char</code></td>
<td style="text-align:left"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>0</mn></mrow><annotation encoding="application/x-tex">0</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">0</span></span></span></span> ~ <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>255</mn></mrow><annotation encoding="application/x-tex">255</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">255</span></span></span></span></td>
</tr>
<tr>
<td style="text-align:left"><code>unsigned short</code></td>
<td style="text-align:left"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>0</mn></mrow><annotation encoding="application/x-tex">0</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">0</span></span></span></span> ~ <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>65535</mn></mrow><annotation encoding="application/x-tex">65535</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">65535</span></span></span></span></td>
</tr>
<tr>
<td style="text-align:left"><code>unsigned int</code></td>
<td style="text-align:left"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>0</mn></mrow><annotation encoding="application/x-tex">0</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">0</span></span></span></span> ~ <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mn>2</mn><mn>32</mn></msup><mo>−</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">2^{32}-1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8974em;vertical-align:-0.0833em;"></span><span class="mord"><span class="mord">2</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">32</span></span></span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">1</span></span></span></span></td>
</tr>
<tr>
<td style="text-align:left"><code>unsigned long long</code></td>
<td style="text-align:left"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>0</mn></mrow><annotation encoding="application/x-tex">0</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">0</span></span></span></span> ~ <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mn>2</mn><mn>64</mn></msup><mo>−</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">2^{64}-1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8974em;vertical-align:-0.0833em;"></span><span class="mord"><span class="mord">2</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">64</span></span></span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">1</span></span></span></span></td>
</tr>
</tbody>
</table>
<blockquote>
<p>字节数可用 <code>sizeof</code> 运算符在目标平台上验证</p>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="9" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="33">
<h3 id="%E7%94%A8-sizeof-%E9%AA%8C%E8%AF%81%E7%B1%BB%E5%9E%8B%E5%A4%A7%E5%B0%8F">用 <code>sizeof</code> 验证类型大小</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>

<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;char:   %zu bytes\n&quot;</span>, <span class="hljs-keyword">sizeof</span>(<span class="hljs-type">char</span>));     <span class="hljs-comment">// 1</span>
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;short:  %zu bytes\n&quot;</span>, <span class="hljs-keyword">sizeof</span>(<span class="hljs-type">short</span>));    <span class="hljs-comment">// 2</span>
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;int:    %zu bytes\n&quot;</span>, <span class="hljs-keyword">sizeof</span>(<span class="hljs-type">int</span>));      <span class="hljs-comment">// 4</span>
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;long:   %zu bytes\n&quot;</span>, <span class="hljs-keyword">sizeof</span>(<span class="hljs-type">long</span>));     <span class="hljs-comment">// 4 或 8</span>
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;long long: %zu bytes\n&quot;</span>, <span class="hljs-keyword">sizeof</span>(<span class="hljs-type">long</span> <span class="hljs-type">long</span>)); <span class="hljs-comment">// 8</span>
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;float:  %zu bytes\n&quot;</span>, <span class="hljs-keyword">sizeof</span>(<span class="hljs-type">float</span>));    <span class="hljs-comment">// 4</span>
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;double: %zu bytes\n&quot;</span>, <span class="hljs-keyword">sizeof</span>(<span class="hljs-type">double</span>));   <span class="hljs-comment">// 8</span>
    <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
}
</code></pre>
<ul>
<li><code>sizeof</code> 是<strong>编译时运算符</strong>，不是函数</li>
<li>返回 <code>size_t</code> 类型，用 <code>%zu</code> 打印（C99）</li>
<li><code>char</code> 永远是 1 字节，其他类型平台相关</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-marpit-scope-2qTWfiDt="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="10" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="33">
<h2 id="%E6%B5%AE%E7%82%B9%E7%B1%BB%E5%9E%8B">浮点类型</h2>

<table>
<thead>
<tr>
<th style="text-align:left">类型</th>
<th style="text-align:center">字节数</th>
<th style="text-align:center">有效数字</th>
<th style="text-align:left">值域（绝对值）</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><code>float</code></td>
<td style="text-align:center">4</td>
<td style="text-align:center">6~7 位</td>
<td style="text-align:left"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>1.2</mn><mo>×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>38</mn></mrow></msup></mrow><annotation encoding="application/x-tex">1.2 \times 10^{-38}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">1.2</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.8141em;"></span><span class="mord">1</span><span class="mord"><span class="mord">0</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">−</span><span class="mord mtight">38</span></span></span></span></span></span></span></span></span></span></span></span> ~ <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>3.4</mn><mo>×</mo><msup><mn>10</mn><mn>38</mn></msup></mrow><annotation encoding="application/x-tex">3.4 \times 10^{38}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">3.4</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.8141em;"></span><span class="mord">1</span><span class="mord"><span class="mord">0</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">38</span></span></span></span></span></span></span></span></span></span></span></span></td>
</tr>
<tr>
<td style="text-align:left"><code>double</code></td>
<td style="text-align:center">8</td>
<td style="text-align:center">15~16 位</td>
<td style="text-align:left"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>2.2</mn><mo>×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>308</mn></mrow></msup></mrow><annotation encoding="application/x-tex">2.2 \times 10^{-308}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">2.2</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.8141em;"></span><span class="mord">1</span><span class="mord"><span class="mord">0</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">−</span><span class="mord mtight">308</span></span></span></span></span></span></span></span></span></span></span></span> ~ <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>1.8</mn><mo>×</mo><msup><mn>10</mn><mn>308</mn></msup></mrow><annotation encoding="application/x-tex">1.8 \times 10^{308}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">1.8</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.8141em;"></span><span class="mord">1</span><span class="mord"><span class="mord">0</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">308</span></span></span></span></span></span></span></span></span></span></span></span></td>
</tr>
<tr>
<td style="text-align:left"><code>long double</code></td>
<td style="text-align:center">8/12/16</td>
<td style="text-align:center">18+ 位</td>
<td style="text-align:left">平台相关</td>
</tr>
</tbody>
</table>
<p><strong>浮点数的精度陷阱</strong>：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">float</span> f = <span class="hljs-number">0.1f</span>;
<span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%.20f\n&quot;</span>, f);   <span class="hljs-comment">// 输出: 0.10000000149011611938</span>
</code></pre>
<ul>
<li>0.1 无法精确表示为二进制浮点数</li>
<li><strong>经验法则</strong>：比较浮点数用 <code>fabs(a - b) &lt; EPS</code>，不要用 <code>a == b</code></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-marpit-scope-X2efVK2S="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="11" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="33">
<h2 id="%E5%AD%97%E7%AC%A6%E7%B1%BB%E5%9E%8B">字符类型</h2>

<ul>
<li><code>char</code> 在内存中存储的是字符的 <strong>ASCII 码值</strong>（0~127）</li>
<li>字符常量用<strong>单引号</strong>括起：<code>'A'</code>、<code>'0'</code>、<code>'\n'</code></li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">char</span> ch = <span class="hljs-string">&#x27;A&#x27;</span>;     <span class="hljs-comment">// 等价于 char ch = 65;</span>
<span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%c %d\n&quot;</span>, ch, ch);  <span class="hljs-comment">// 输出: A 65</span>
</code></pre>
<ul>
<li><code>'0'</code> 的 ASCII 码是 48，<strong>不等于</strong>整数 <code>0</code></li>
<li><code>'A'</code>~<code>'Z'</code> 连续编码 65~90</li>
<li><code>'a'</code>~<code>'z'</code> 连续编码 97~122</li>
<li>大小写转换：<code>ch - 'A' + 'a'</code> 或 <code>ch + 32</code></li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">char</span> upper = <span class="hljs-string">&#x27;G&#x27;</span>;
<span class="hljs-type">char</span> lower = upper - <span class="hljs-string">&#x27;A&#x27;</span> + <span class="hljs-string">&#x27;a&#x27;</span>;   <span class="hljs-comment">// &#x27;g&#x27;</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-marpit-scope-3CIE6nNI="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="12" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="33">
<h2 id="%E5%B8%83%E5%B0%94%E7%B1%BB%E5%9E%8Bc99">布尔类型（C99）</h2>

<p>C99 引入 <code>_Bool</code> 类型和 <code>&lt;stdbool.h&gt;</code> 头文件：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdbool.h&gt;</span></span>

<span class="hljs-type">bool</span> flag = <span class="hljs-literal">true</span>;    <span class="hljs-comment">// 等价于 _Bool flag = 1;</span>
<span class="hljs-keyword">if</span> (flag) {
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;flag is true\n&quot;</span>);
}
flag = <span class="hljs-literal">false</span>;        <span class="hljs-comment">// 等价于 flag = 0;</span>
</code></pre>
<ul>
<li>C 语言中，<strong>0 为假，非 0 为真</strong></li>
<li><code>true</code> = 1，<code>false</code> = 0（定义在 <code>&lt;stdbool.h&gt;</code> 中）</li>
<li>逻辑表达式（<code>&lt;</code> <code>&gt;</code> <code>==</code> <code>&amp;&amp;</code> <code>||</code> <code>!</code>）的结果为 <code>0</code> 或 <code>1</code></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-marpit-scope-Krh9iKO4="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="13" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="33">
<h2 id="%E5%B8%B8%E9%87%8F">常量</h2>

<p><strong>字面常量</strong>：直接写在代码里的值</p>
<table>
<thead>
<tr>
<th style="text-align:left">类型</th>
<th style="text-align:left">示例</th>
<th style="text-align:left">说明</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">整型</td>
<td style="text-align:left"><code>42</code></td>
<td style="text-align:left">十进制</td>
</tr>
<tr>
<td style="text-align:left">整型</td>
<td style="text-align:left"><code>052</code></td>
<td style="text-align:left">八进制（前缀 <code>0</code>）</td>
</tr>
<tr>
<td style="text-align:left">整型</td>
<td style="text-align:left"><code>0x2A</code></td>
<td style="text-align:left">十六进制（前缀 <code>0x</code>）</td>
</tr>
<tr>
<td style="text-align:left">长整型</td>
<td style="text-align:left"><code>42L</code></td>
<td style="text-align:left">后缀 <code>L</code></td>
</tr>
<tr>
<td style="text-align:left">无符号</td>
<td style="text-align:left"><code>42U</code></td>
<td style="text-align:left">后缀 <code>U</code></td>
</tr>
<tr>
<td style="text-align:left">浮点</td>
<td style="text-align:left"><code>3.14</code></td>
<td style="text-align:left">默认 <code>double</code></td>
</tr>
<tr>
<td style="text-align:left">浮点</td>
<td style="text-align:left"><code>3.14f</code></td>
<td style="text-align:left">后缀 <code>f</code> 为 <code>float</code></td>
</tr>
<tr>
<td style="text-align:left">浮点</td>
<td style="text-align:left"><code>1.0e-3</code></td>
<td style="text-align:left">科学计数法</td>
</tr>
<tr>
<td style="text-align:left">字符</td>
<td style="text-align:left"><code>'A'</code></td>
<td style="text-align:left">单引号</td>
</tr>
<tr>
<td style="text-align:left">字符串</td>
<td style="text-align:left"><code>&quot;hello&quot;</code></td>
<td style="text-align:left">双引号，末尾自动加 <code>'\0'</code></td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-marpit-scope-4e771ni6="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="14" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="33">
<h3 id="%E7%AC%A6%E5%8F%B7%E5%B8%B8%E9%87%8F">符号常量</h3>

<p><strong>方式一：<code>#define</code> 宏定义</strong>（预处理替换，无类型检查）</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">define</span> PI 3.14159</span>
<span class="hljs-meta">#<span class="hljs-keyword">define</span> MAX_SIZE 100</span>
</code></pre>
<p><strong>方式二：<code>const</code> 修饰</strong>（有类型检查，推荐）</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">const</span> <span class="hljs-type">double</span> PI = <span class="hljs-number">3.14159</span>;
<span class="hljs-type">const</span> <span class="hljs-type">int</span> MAX_SIZE = <span class="hljs-number">100</span>;
</code></pre>
<p><strong>区别</strong>：</p>
<table>
<thead>
<tr>
<th style="text-align:left">特性</th>
<th style="text-align:left"><code>#define</code></th>
<th style="text-align:left"><code>const</code></th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">处理时机</td>
<td style="text-align:left">预处理阶段</td>
<td style="text-align:left">编译阶段</td>
</tr>
<tr>
<td style="text-align:left">类型检查</td>
<td style="text-align:left">无</td>
<td style="text-align:left">有</td>
</tr>
<tr>
<td style="text-align:left">调试可见性</td>
<td style="text-align:left">不可见（已替换）</td>
<td style="text-align:left">可见</td>
</tr>
<tr>
<td style="text-align:left">作用域</td>
<td style="text-align:left">全局（从定义到文件末尾）</td>
<td style="text-align:left">遵循作用域规则</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-marpit-scope-14hr0UiT="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="15" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="33">
<h2 id="%E5%8F%98%E9%87%8F">变量</h2>

<p><strong>变量</strong>：程序运行过程中值可以改变的量</p>
<p><strong>声明与定义</strong>：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">int</span> age;                 <span class="hljs-comment">// 定义：分配内存</span>
<span class="hljs-type">int</span> age = <span class="hljs-number">20</span>;            <span class="hljs-comment">// 定义并初始化</span>
<span class="hljs-keyword">extern</span> <span class="hljs-type">int</span> count;        <span class="hljs-comment">// 声明（不分配内存）：告诉编译器 count 在别处定义</span>
</code></pre>
<p><strong>要点</strong>：</p>
<ul>
<li>变量<strong>必须先定义后使用</strong></li>
<li>C89 要求变量定义在代码块<strong>开头</strong>；C99 允许在任意位置定义</li>
<li>未初始化的<strong>局部变量值不确定</strong>（未定义行为），<strong>全局变量默认初始化为 0</strong></li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
    <span class="hljs-type">int</span> a;              <span class="hljs-comment">// 局部变量，值不确定！</span>
    <span class="hljs-type">int</span> b = <span class="hljs-number">0</span>;          <span class="hljs-comment">// 显式初始化</span>
    <span class="hljs-comment">// C99 写法：</span>
    <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i = <span class="hljs-number">0</span>; i &lt; <span class="hljs-number">10</span>; i++) { ... }
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-marpit-scope-o7XFi4va="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="16" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="33">
<h3 id="%E5%8F%98%E9%87%8F%E7%9A%84%E4%BD%9C%E7%94%A8%E5%9F%9F">变量的作用域</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>

<span class="hljs-type">int</span> g = <span class="hljs-number">100</span>;                <span class="hljs-comment">// 全局变量：文件作用域</span>

<span class="hljs-type">void</span> <span class="hljs-title function_">func</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
    <span class="hljs-type">int</span> a = <span class="hljs-number">1</span>;              <span class="hljs-comment">// 局部变量：块作用域</span>
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;a=%d, g=%d\n&quot;</span>, a, g);
}

<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
    <span class="hljs-type">int</span> a = <span class="hljs-number">2</span>;              <span class="hljs-comment">// 另一个局部变量，与 func 中的 a 无关</span>
    {
        <span class="hljs-type">int</span> b = <span class="hljs-number">3</span>;          <span class="hljs-comment">// 内层块作用域</span>
        <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;b=%d\n&quot;</span>, b);
    }
    <span class="hljs-comment">// printf(&quot;%d\n&quot;, b);  // 错误！b 不在此作用域</span>
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;a=%d, g=%d\n&quot;</span>, a, g);
    <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
}
</code></pre>
<ul>
<li><strong>全局变量</strong>：函数外定义，整个文件可见</li>
<li><strong>局部变量</strong>：函数或代码块内定义，仅在该块内可见</li>
<li>同名变量：内层作用域<strong>遮蔽</strong>外层</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-marpit-scope-W88P60Pu="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="17" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="33">
<h2 id="%E8%BF%90%E7%AE%97%E7%AC%A6%E5%92%8C%E8%A1%A8%E8%BE%BE%E5%BC%8F">运算符和表达式</h2>
<h3 id="%E7%AE%97%E6%9C%AF%E8%BF%90%E7%AE%97%E7%AC%A6">算术运算符</h3>

<table>
<thead>
<tr>
<th style="text-align:center">运算符</th>
<th style="text-align:left">含义</th>
<th style="text-align:left">示例</th>
<th style="text-align:left">结果</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:center"><code>+</code></td>
<td style="text-align:left">加</td>
<td style="text-align:left"><code>3 + 2</code></td>
<td style="text-align:left"><code>5</code></td>
</tr>
<tr>
<td style="text-align:center"><code>-</code></td>
<td style="text-align:left">减</td>
<td style="text-align:left"><code>3 - 2</code></td>
<td style="text-align:left"><code>1</code></td>
</tr>
<tr>
<td style="text-align:center"><code>*</code></td>
<td style="text-align:left">乘</td>
<td style="text-align:left"><code>3 * 2</code></td>
<td style="text-align:left"><code>6</code></td>
</tr>
<tr>
<td style="text-align:center"><code>/</code></td>
<td style="text-align:left">除</td>
<td style="text-align:left"><code>7 / 2</code></td>
<td style="text-align:left"><code>3</code>（整数除法）</td>
</tr>
<tr>
<td style="text-align:center"><code>%</code></td>
<td style="text-align:left">取模</td>
<td style="text-align:left"><code>7 % 2</code></td>
<td style="text-align:left"><code>1</code></td>
</tr>
<tr>
<td style="text-align:center"><code>++</code></td>
<td style="text-align:left">自增</td>
<td style="text-align:left"><code>i++</code> / <code>++i</code></td>
<td style="text-align:left">i 的值加 1</td>
</tr>
<tr>
<td style="text-align:center"><code>--</code></td>
<td style="text-align:left">自减</td>
<td style="text-align:left"><code>i--</code> / <code>--i</code></td>
<td style="text-align:left">i 的值减 1</td>
</tr>
</tbody>
</table>
<p><strong>注意</strong>：</p>
<ul>
<li>整数除法<strong>截断小数</strong>：<code>7 / 2</code> → <code>3</code>，不是 <code>3.5</code></li>
<li><code>%</code> 只能用于整数</li>
<li><code>++i</code>（前缀）：先加 1 再使用；<code>i++</code>（后缀）：先使用再加 1</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-marpit-scope-i2iBzpLB="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="18" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="33">
<h3 id="%E8%87%AA%E5%A2%9E%E8%87%AA%E5%87%8F%E8%BF%90%E7%AE%97%E7%AC%A6%E8%AF%A6%E8%A7%A3">自增/自减运算符详解</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">int</span> i = <span class="hljs-number">5</span>;
<span class="hljs-type">int</span> a = ++i;   <span class="hljs-comment">// i 先变为 6，a = 6</span>
<span class="hljs-type">int</span> b = i++;   <span class="hljs-comment">// b = 6（使用当前值），然后 i 变为 7</span>
</code></pre>
<p><strong>经典陷阱</strong>：不要在同一个表达式中对同一变量多次使用 <code>++</code>/<code>--</code></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">int</span> i = <span class="hljs-number">3</span>;
<span class="hljs-type">int</span> a = i++ + ++i;   <span class="hljs-comment">// 未定义行为！不同编译器结果不同</span>
</code></pre>
<blockquote>
<p><strong>规则</strong>：两个序列点之间，同一变量的值最多被修改一次。</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-marpit-scope-MCb6hx3s="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="19" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="33">
<h3 id="%E5%85%B3%E7%B3%BB%E8%BF%90%E7%AE%97%E7%AC%A6">关系运算符</h3>

<table>
<thead>
<tr>
<th style="text-align:center">运算符</th>
<th style="text-align:left">含义</th>
<th style="text-align:left">示例</th>
<th style="text-align:left">结果</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:center"><code>&gt;</code></td>
<td style="text-align:left">大于</td>
<td style="text-align:left"><code>5 &gt; 3</code></td>
<td style="text-align:left"><code>1</code></td>
</tr>
<tr>
<td style="text-align:center"><code>&lt;</code></td>
<td style="text-align:left">小于</td>
<td style="text-align:left"><code>5 &lt; 3</code></td>
<td style="text-align:left"><code>0</code></td>
</tr>
<tr>
<td style="text-align:center"><code>&gt;=</code></td>
<td style="text-align:left">大于等于</td>
<td style="text-align:left"><code>5 &gt;= 5</code></td>
<td style="text-align:left"><code>1</code></td>
</tr>
<tr>
<td style="text-align:center"><code>&lt;=</code></td>
<td style="text-align:left">小于等于</td>
<td style="text-align:left"><code>5 &lt;= 3</code></td>
<td style="text-align:left"><code>0</code></td>
</tr>
<tr>
<td style="text-align:center"><code>==</code></td>
<td style="text-align:left">等于</td>
<td style="text-align:left"><code>5 == 3</code></td>
<td style="text-align:left"><code>0</code></td>
</tr>
<tr>
<td style="text-align:center"><code>!=</code></td>
<td style="text-align:left">不等于</td>
<td style="text-align:left"><code>5 != 3</code></td>
<td style="text-align:left"><code>1</code></td>
</tr>
</tbody>
</table>
<ul>
<li>关系表达式的结果是 <code>0</code>（假）或 <code>1</code>（真）</li>
<li><strong>常见错误</strong>：把 <code>==</code> 写成 <code>=</code>（赋值）</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-keyword">if</span> (a = <span class="hljs-number">5</span>) { ... }    <span class="hljs-comment">// 永远为真！a 被赋值为 5</span>
<span class="hljs-keyword">if</span> (a == <span class="hljs-number">5</span>) { ... }   <span class="hljs-comment">// 正确：判断 a 是否等于 5</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-marpit-scope-Np1NJ6Nd="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="20" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="33">
<h3 id="%E9%80%BB%E8%BE%91%E8%BF%90%E7%AE%97%E7%AC%A6">逻辑运算符</h3>

<table>
<thead>
<tr>
<th style="text-align:center">运算符</th>
<th style="text-align:left">含义</th>
<th style="text-align:left">示例</th>
<th style="text-align:left">结果</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:center"><code>&amp;&amp;</code></td>
<td style="text-align:left">逻辑与</td>
<td style="text-align:left"><code>1 &amp;&amp; 0</code></td>
<td style="text-align:left"><code>0</code></td>
</tr>
<tr>
<td style="text-align:center">`</td>
<td style="text-align:left"></td>
<td style="text-align:left">`</td>
<td style="text-align:left">逻辑或</td>
</tr>
<tr>
<td style="text-align:center"><code>!</code></td>
<td style="text-align:left">逻辑非</td>
<td style="text-align:left"><code>!1</code></td>
<td style="text-align:left"><code>0</code></td>
</tr>
</tbody>
</table>
<p><strong>短路求值</strong>：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-keyword">if</span> (p != <span class="hljs-literal">NULL</span> &amp;&amp; p-&gt;value &gt; <span class="hljs-number">0</span>) { ... }
<span class="hljs-comment">// 若 p == NULL，则 p-&gt;value 不会执行，避免空指针解引用</span>

<span class="hljs-keyword">if</span> (x &gt; <span class="hljs-number">0</span> || y &gt; <span class="hljs-number">0</span>) { ... }
<span class="hljs-comment">// 若 x &gt; 0 为真，y &gt; 0 不会计算</span>
</code></pre>
<ul>
<li><code>&amp;&amp;</code>：左操作数为 0 时，右操作数<strong>不计算</strong></li>
<li><code>||</code>：左操作数非 0 时，右操作数<strong>不计算</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-marpit-scope-nk8m5RE9="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="21" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="33">
<h3 id="%E8%B5%8B%E5%80%BC%E8%BF%90%E7%AE%97%E7%AC%A6">赋值运算符</h3>

<table>
<thead>
<tr>
<th style="text-align:center">运算符</th>
<th style="text-align:left">等价写法</th>
<th style="text-align:left">示例</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:center"><code>=</code></td>
<td style="text-align:left">—</td>
<td style="text-align:left"><code>a = 5</code></td>
</tr>
<tr>
<td style="text-align:center"><code>+=</code></td>
<td style="text-align:left"><code>a = a + b</code></td>
<td style="text-align:left"><code>a += 3</code></td>
</tr>
<tr>
<td style="text-align:center"><code>-=</code></td>
<td style="text-align:left"><code>a = a - b</code></td>
<td style="text-align:left"><code>a -= 3</code></td>
</tr>
<tr>
<td style="text-align:center"><code>*=</code></td>
<td style="text-align:left"><code>a = a * b</code></td>
<td style="text-align:left"><code>a *= 3</code></td>
</tr>
<tr>
<td style="text-align:center"><code>/=</code></td>
<td style="text-align:left"><code>a = a / b</code></td>
<td style="text-align:left"><code>a /= 3</code></td>
</tr>
<tr>
<td style="text-align:center"><code>%=</code></td>
<td style="text-align:left"><code>a = a % b</code></td>
<td style="text-align:left"><code>a %= 3</code></td>
</tr>
<tr>
<td style="text-align:center"><code>&lt;&lt;=</code></td>
<td style="text-align:left"><code>a = a &lt;&lt; b</code></td>
<td style="text-align:left"><code>a &lt;&lt;= 2</code></td>
</tr>
<tr>
<td style="text-align:center"><code>&gt;&gt;=</code></td>
<td style="text-align:left"><code>a = a &gt;&gt; b</code></td>
<td style="text-align:left"><code>a &gt;&gt;= 2</code></td>
</tr>
<tr>
<td style="text-align:center"><code>&amp;=</code></td>
<td style="text-align:left"><code>a = a &amp; b</code></td>
<td style="text-align:left"><code>a &amp;= mask</code></td>
</tr>
<tr>
<td style="text-align:center">`</td>
<td style="text-align:left">=`</td>
<td style="text-align:left">`a = a</td>
</tr>
<tr>
<td style="text-align:center"><code>^=</code></td>
<td style="text-align:left"><code>a = a ^ b</code></td>
<td style="text-align:left"><code>a ^= key</code></td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-marpit-scope-DGL7WEIA="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="22" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="33">
<h3 id="%E6%9D%A1%E4%BB%B6%E8%BF%90%E7%AE%97%E7%AC%A6%E4%B8%89%E7%9B%AE%E8%BF%90%E7%AE%97%E7%AC%A6">条件运算符（三目运算符）</h3>

<p><strong>语法</strong>：<code>表达式1 ? 表达式2 : 表达式3</code></p>
<ul>
<li>若 <code>表达式1</code> 为真（非 0），整个表达式的值为 <code>表达式2</code></li>
<li>否则为 <code>表达式3</code></li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">int</span> max = (a &gt; b) ? a : b;       <span class="hljs-comment">// 取较大值</span>
<span class="hljs-type">int</span> abs_val = (x &gt;= <span class="hljs-number">0</span>) ? x : -x; <span class="hljs-comment">// 绝对值</span>
</code></pre>
<p><strong>嵌套</strong>（可读性差，不推荐）：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">int</span> grade = (score &gt;= <span class="hljs-number">90</span>) ? <span class="hljs-string">&#x27;A&#x27;</span> :
            (score &gt;= <span class="hljs-number">60</span>) ? <span class="hljs-string">&#x27;B&#x27;</span> : <span class="hljs-string">&#x27;C&#x27;</span>;
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-marpit-scope-sWBlU1Ie="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="23" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="33">
<h3 id="%E9%80%97%E5%8F%B7%E8%BF%90%E7%AE%97%E7%AC%A6">逗号运算符</h3>

<p><strong>语法</strong>：<code>表达式1, 表达式2, ..., 表达式n</code></p>
<ul>
<li>从左到右依次求值，整个逗号表达式的值为<strong>最后一个</strong>表达式的值</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">int</span> a = (<span class="hljs-number">1</span>, <span class="hljs-number">2</span>, <span class="hljs-number">3</span>);   <span class="hljs-comment">// a = 3</span>
</code></pre>
<p><strong>常见用途</strong>：<code>for</code> 循环中同时操作多个变量</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i = <span class="hljs-number">0</span>, j = <span class="hljs-number">10</span>; i &lt; j; i++, j--) {
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;i=%d, j=%d\n&quot;</span>, i, j);
}
</code></pre>
<blockquote>
<p>注意区分：<code>int a = 1, b = 2;</code> 中的逗号是<strong>声明分隔符</strong>，不是逗号运算符。</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-marpit-scope-jSQlYH8J="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="24" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="33">
<h3 id="sizeof-%E8%BF%90%E7%AE%97%E7%AC%A6">sizeof 运算符</h3>

<ul>
<li>求类型或变量所占<strong>字节数</strong></li>
<li>编译时求值，不运行代码</li>
<li>对数组求值返回整个数组占用的字节数</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">int</span> arr[<span class="hljs-number">10</span>];
<span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%zu\n&quot;</span>, <span class="hljs-keyword">sizeof</span>(arr));       <span class="hljs-comment">// 40 (10 × 4)</span>
<span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%zu\n&quot;</span>, <span class="hljs-keyword">sizeof</span>(arr[<span class="hljs-number">0</span>]));    <span class="hljs-comment">// 4</span>
<span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%zu\n&quot;</span>, <span class="hljs-keyword">sizeof</span>(arr) / <span class="hljs-keyword">sizeof</span>(arr[<span class="hljs-number">0</span>]));  <span class="hljs-comment">// 10，数组元素个数</span>

<span class="hljs-type">int</span> n = <span class="hljs-number">0</span>;
<span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%zu\n&quot;</span>, <span class="hljs-keyword">sizeof</span>(n++));      <span class="hljs-comment">// 4，n++ 不会执行！</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-marpit-scope-ff5L3oQh="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="25" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="33">
<h2 id="%E8%BF%90%E7%AE%97%E7%AC%A6%E4%BC%98%E5%85%88%E7%BA%A7%E5%B8%B8%E7%94%A8">运算符优先级（常用）</h2>

<table>
<thead>
<tr>
<th style="text-align:center">优先级</th>
<th style="text-align:left">运算符</th>
<th style="text-align:left">结合性</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:center">1 (最高)</td>
<td style="text-align:left"><code>()</code> <code>[]</code> <code>-&gt;</code> <code>.</code></td>
<td style="text-align:left">左到右</td>
</tr>
<tr>
<td style="text-align:center">2</td>
<td style="text-align:left"><code>!</code> <code>~</code> <code>++</code> <code>--</code> <code>+</code> <code>-</code> <code>*</code> <code>&amp;</code> <code>(type)</code> <code>sizeof</code></td>
<td style="text-align:left"><strong>右到左</strong></td>
</tr>
<tr>
<td style="text-align:center">3</td>
<td style="text-align:left"><code>*</code> <code>/</code> <code>%</code></td>
<td style="text-align:left">左到右</td>
</tr>
<tr>
<td style="text-align:center">4</td>
<td style="text-align:left"><code>+</code> <code>-</code></td>
<td style="text-align:left">左到右</td>
</tr>
<tr>
<td style="text-align:center">5</td>
<td style="text-align:left"><code>&lt;&lt;</code> <code>&gt;&gt;</code></td>
<td style="text-align:left">左到右</td>
</tr>
<tr>
<td style="text-align:center">6</td>
<td style="text-align:left"><code>&lt;</code> <code>&lt;=</code> <code>&gt;</code> <code>&gt;=</code></td>
<td style="text-align:left">左到右</td>
</tr>
<tr>
<td style="text-align:center">7</td>
<td style="text-align:left"><code>==</code> <code>!=</code></td>
<td style="text-align:left">左到右</td>
</tr>
<tr>
<td style="text-align:center">8</td>
<td style="text-align:left"><code>&amp;</code></td>
<td style="text-align:left">左到右</td>
</tr>
<tr>
<td style="text-align:center">9</td>
<td style="text-align:left"><code>^</code></td>
<td style="text-align:left">左到右</td>
</tr>
<tr>
<td style="text-align:center">10</td>
<td style="text-align:left">`</td>
<td style="text-align:left">`</td>
</tr>
<tr>
<td style="text-align:center">11</td>
<td style="text-align:left"><code>&amp;&amp;</code></td>
<td style="text-align:left">左到右</td>
</tr>
<tr>
<td style="text-align:center">12</td>
<td style="text-align:left">`</td>
<td style="text-align:left"></td>
</tr>
<tr>
<td style="text-align:center">13</td>
<td style="text-align:left"><code>?:</code></td>
<td style="text-align:left">右到左</td>
</tr>
<tr>
<td style="text-align:center">14</td>
<td style="text-align:left"><code>=</code> <code>+=</code> <code>-=</code> 等</td>
<td style="text-align:left">右到左</td>
</tr>
<tr>
<td style="text-align:center">15 (最低)</td>
<td style="text-align:left"><code>,</code></td>
<td style="text-align:left">左到右</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>技巧</strong>：拿不准优先级时，<strong>加括号</strong>——既清晰又安全。</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-marpit-scope-KEf37xvI="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="26" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="33">
<h2 id="%E4%BD%8D%E8%BF%90%E7%AE%97">位运算</h2>

<p>位运算直接操作二进制位，常用于底层编程、硬件控制、加密算法</p>
<table>
<thead>
<tr>
<th style="text-align:center">运算符</th>
<th style="text-align:left">含义</th>
<th style="text-align:left">示例（8位）</th>
<th style="text-align:left">结果</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:center"><code>&amp;</code></td>
<td style="text-align:left">按位与</td>
<td style="text-align:left"><code>0b1100 &amp; 0b1010</code></td>
<td style="text-align:left"><code>0b1000</code></td>
</tr>
<tr>
<td style="text-align:center">`</td>
<td style="text-align:left">`</td>
<td style="text-align:left">按位或</td>
<td style="text-align:left">`0b1100</td>
</tr>
<tr>
<td style="text-align:center"><code>^</code></td>
<td style="text-align:left">按位异或</td>
<td style="text-align:left"><code>0b1100 ^ 0b1010</code></td>
<td style="text-align:left"><code>0b0110</code></td>
</tr>
<tr>
<td style="text-align:center"><code>~</code></td>
<td style="text-align:left">按位取反</td>
<td style="text-align:left"><code>~0b1100</code></td>
<td style="text-align:left">取决于类型</td>
</tr>
<tr>
<td style="text-align:center"><code>&lt;&lt;</code></td>
<td style="text-align:left">左移</td>
<td style="text-align:left"><code>0b0011 &lt;&lt; 2</code></td>
<td style="text-align:left"><code>0b1100</code></td>
</tr>
<tr>
<td style="text-align:center"><code>&gt;&gt;</code></td>
<td style="text-align:left">右移</td>
<td style="text-align:left"><code>0b1100 &gt;&gt; 2</code></td>
<td style="text-align:left"><code>0b0011</code></td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>注</strong>：示例中的 <code>0b1100</code> 是二进制字面量，C23 才纳入标准；当前以 <code>-std=c11</code> 为基准时属于 GCC/Clang 扩展（可用 <code>0xC &amp; 0xA</code> 等十六进制写法替代）。</p>
</blockquote>
<ul>
<li>左移 <code>n</code> 位 ≈ 乘以 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mn>2</mn><mi>n</mi></msup></mrow><annotation encoding="application/x-tex">2^n</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6644em;"></span><span class="mord"><span class="mord">2</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.6644em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">n</span></span></span></span></span></span></span></span></span></span></span>（无溢出时）</li>
<li>右移 <code>n</code> 位 ≈ 除以 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mn>2</mn><mi>n</mi></msup></mrow><annotation encoding="application/x-tex">2^n</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6644em;"></span><span class="mord"><span class="mord">2</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.6644em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">n</span></span></span></span></span></span></span></span></span></span></span>（对正数）</li>
<li>右移对<strong>有符号数</strong>：算术移位（补符号位）还是逻辑移位（补 0），取决于编译器</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-marpit-scope-pzYFzGlo="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="27" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="33">
<h3 id="%E4%BD%8D%E8%BF%90%E7%AE%97%E5%85%B8%E5%9E%8B%E5%BA%94%E7%94%A8">位运算典型应用</h3>

<p><strong>1. 掩码（Mask）—— 取出特定位</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">unsigned</span> <span class="hljs-type">int</span> flags = <span class="hljs-number">0xA5</span>;         <span class="hljs-comment">// 10100101</span>
<span class="hljs-type">unsigned</span> <span class="hljs-type">int</span> mask  = <span class="hljs-number">0x0F</span>;         <span class="hljs-comment">// 00001111</span>
<span class="hljs-type">unsigned</span> <span class="hljs-type">int</span> low   = flags &amp; mask; <span class="hljs-comment">// 00000101，取出低4位</span>
</code></pre>
<p><strong>2. 置位（Set bit）—— 将某位置 1</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c">flags |= (<span class="hljs-number">1</span> &lt;&lt; <span class="hljs-number">3</span>);     <span class="hljs-comment">// 将第3位置1</span>
</code></pre>
<p><strong>3. 清位（Clear bit）—— 将某位清 0</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c">flags &amp;= ~(<span class="hljs-number">1</span> &lt;&lt; <span class="hljs-number">3</span>);    <span class="hljs-comment">// 将第3位清0</span>
</code></pre>
<p><strong>4. 翻转（Toggle bit）</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c">flags ^= (<span class="hljs-number">1</span> &lt;&lt; <span class="hljs-number">3</span>);     <span class="hljs-comment">// 将第3位取反</span>
</code></pre>
<p><strong>5. 判断某位是否为 1</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-keyword">if</span> (flags &amp; (<span class="hljs-number">1</span> &lt;&lt; <span class="hljs-number">3</span>)) { <span class="hljs-comment">/* 第3位为1 */</span> }
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-marpit-scope-d4yyBfVc="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="28" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="33">
<h3 id="%E4%BD%8D%E8%BF%90%E7%AE%97%E5%AE%9E%E4%BE%8B%E6%9D%83%E9%99%90%E6%8E%A7%E5%88%B6">位运算实例：权限控制</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>

<span class="hljs-meta">#<span class="hljs-keyword">define</span> PERM_READ    (1 &lt;&lt; 0)  <span class="hljs-comment">// 0001</span></span>
<span class="hljs-meta">#<span class="hljs-keyword">define</span> PERM_WRITE   (1 &lt;&lt; 1)  <span class="hljs-comment">// 0010</span></span>
<span class="hljs-meta">#<span class="hljs-keyword">define</span> PERM_EXEC    (1 &lt;&lt; 2)  <span class="hljs-comment">// 0100</span></span>

<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> {
    <span class="hljs-type">unsigned</span> <span class="hljs-type">int</span> user_perm = PERM_READ | PERM_EXEC;  <span class="hljs-comment">// 读+执行: 0101</span>

    <span class="hljs-comment">// 检查权限</span>
    <span class="hljs-keyword">if</span> (user_perm &amp; PERM_READ)  <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;可读\n&quot;</span>);
    <span class="hljs-keyword">if</span> (user_perm &amp; PERM_WRITE) <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;可写\n&quot;</span>);   <span class="hljs-comment">// 不输出</span>
    <span class="hljs-keyword">if</span> (user_perm &amp; PERM_EXEC)  <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;可执行\n&quot;</span>);

    <span class="hljs-comment">// 添加写权限</span>
    user_perm |= PERM_WRITE;

    <span class="hljs-comment">// 移除执行权限</span>
    user_perm &amp;= ~PERM_EXEC;

    <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="29" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="33">
<h3 id="%E4%BD%8D%E8%BF%90%E7%AE%97%E5%AE%9E%E4%BE%8B%E4%BA%A4%E6%8D%A2%E4%B8%A4%E4%B8%AA%E5%8F%98%E9%87%8F%E4%B8%8D%E7%94%A8%E4%B8%B4%E6%97%B6%E5%8F%98%E9%87%8F">位运算实例：交换两个变量（不用临时变量）</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c">a = a ^ b;
b = a ^ b;   <span class="hljs-comment">// b = (a^b)^b = a</span>
a = a ^ b;   <span class="hljs-comment">// a = (a^b)^a = b</span>
</code></pre>
<p><strong>原理</strong>：异或的性质</p>
<ul>
<li><code>x ^ x = 0</code></li>
<li><code>x ^ 0 = x</code></li>
<li>异或满足交换律和结合律</li>
</ul>
<blockquote>
<p>实际工程中不推荐这种写法——可读性差，且现代编译器对临时变量方式优化后效率一样。</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-marpit-scope-PE8DgVpQ="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="30" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="33">
<h2 id="%E7%B1%BB%E5%9E%8B%E8%BD%AC%E6%8D%A2">类型转换</h2>
<h3 id="%E8%87%AA%E5%8A%A8%E7%B1%BB%E5%9E%8B%E8%BD%AC%E6%8D%A2%E9%9A%90%E5%BC%8F%E8%BD%AC%E6%8D%A2">自动类型转换（隐式转换）</h3>

<p>在算术运算中，&quot;低级&quot;类型自动转换为&quot;高级&quot;类型：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>高 ←───────────────────── 低
double → float → unsigned long → long → unsigned int → int → char/short
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">int</span>    i = <span class="hljs-number">3</span>;
<span class="hljs-type">double</span> d = <span class="hljs-number">2.5</span>;
<span class="hljs-type">double</span> r = i + d;    <span class="hljs-comment">// i 自动转为 double，r = 5.5</span>

<span class="hljs-type">int</span> a = <span class="hljs-number">5</span>, b = <span class="hljs-number">2</span>;
<span class="hljs-type">double</span> c = a / b;    <span class="hljs-comment">// 先做整数除法得 2，再转为 2.0</span>
<span class="hljs-type">double</span> d = (<span class="hljs-type">double</span>)a / b;  <span class="hljs-comment">// a 先转为 2.0，然后做浮点除法得 2.5</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-marpit-scope-a4jSW17C="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="31" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="33">
<h3 id="%E5%BC%BA%E5%88%B6%E7%B1%BB%E5%9E%8B%E8%BD%AC%E6%8D%A2%E6%98%BE%E5%BC%8F%E8%BD%AC%E6%8D%A2">强制类型转换（显式转换）</h3>

<p><strong>语法</strong>：<code>(类型名)表达式</code></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">double</span> pi = <span class="hljs-number">3.14159</span>;
<span class="hljs-type">int</span> n = (<span class="hljs-type">int</span>)pi;          <span class="hljs-comment">// n = 3，截断小数部分</span>

<span class="hljs-type">int</span> a = <span class="hljs-number">7</span>, b = <span class="hljs-number">2</span>;
<span class="hljs-type">double</span> avg = (<span class="hljs-type">double</span>)a / b;  <span class="hljs-comment">// avg = 3.5</span>

<span class="hljs-comment">// 指针类型转换（高级用法，谨慎使用）</span>
<span class="hljs-type">int</span> x = <span class="hljs-number">0x41424344</span>;
<span class="hljs-type">char</span> *p = (<span class="hljs-type">char</span> *)&amp;x;
<span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%c\n&quot;</span>, *p);      <span class="hljs-comment">// 依赖字节序，结果可能为 &#x27;D&#x27; 或 &#x27;A&#x27;</span>
</code></pre>
<p><strong>注意事项</strong>：</p>
<ul>
<li>浮点→整数：<strong>截断</strong>（不是四舍五入），用 <code>(int)(x + 0.5)</code> 可实现四舍五入</li>
<li>大类型→小类型：可能<strong>溢出</strong>或<strong>丢失精度</strong></li>
<li>指针类型转换：容易导致<strong>对齐问题</strong>和<strong>未定义行为</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-marpit-scope-47bviShG="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="32" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="33">
<h3 id="%E6%95%B4%E6%95%B0%E6%BA%A2%E5%87%BA">整数溢出</h3>

<p><strong>有符号整数溢出</strong>：未定义行为（UB），编译器可能做任何事</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">int</span> x = INT_MAX;   <span class="hljs-comment">// 2147483647</span>
<span class="hljs-type">int</span> y = x + <span class="hljs-number">1</span>;     <span class="hljs-comment">// 未定义行为！可能回绕，可能崩溃</span>
</code></pre>
<p><strong>无符号整数回绕</strong>：明确定义的行为</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">unsigned</span> <span class="hljs-type">int</span> u = <span class="hljs-number">0</span>;
<span class="hljs-type">unsigned</span> <span class="hljs-type">int</span> v = u - <span class="hljs-number">1</span>;    <span class="hljs-comment">// v = UINT_MAX（4294967295），合法</span>
</code></pre>
<p><strong>防范</strong>：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-comment">// 加法溢出检查</span>
<span class="hljs-keyword">if</span> (a &gt; INT_MAX - b) { <span class="hljs-comment">/* 会溢出 */</span> }

<span class="hljs-comment">// 乘法溢出检查</span>
<span class="hljs-keyword">if</span> (b != <span class="hljs-number">0</span> &amp;&amp; a &gt; INT_MAX / b) { <span class="hljs-comment">/* 会溢出 */</span> }
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-marpit-scope-shuU9ILJ="" data-paginate="true" data-theme="gaia" lang="zh-CN" data-marpit-pagination="33" style="--paginate:true;--theme:gaia;" data-marpit-pagination-total="33">
<h2 id="%E6%80%BB%E7%BB%93">总结</h2>

<ul>
<li><strong>字符集与标识符</strong>：C 语言基本符号、命名规则</li>
<li><strong>数据类型</strong>：整型（char/short/int/long/long long）、浮点型（float/double）、布尔型（bool）</li>
<li><strong>常量与变量</strong>：字面常量、<code>#define</code>、<code>const</code>；变量先定义后使用</li>
<li><strong>运算符</strong>：算术、关系、逻辑、赋值、条件、逗号、sizeof</li>
<li><strong>位运算</strong>：与/或/异或/取反/移位——掩码、置位、清位的经典模式</li>
<li><strong>类型转换</strong>：隐式（低→高）、显式（强制）、溢出风险</li>
<li><strong>优先级</strong>：拿不准就加括号</li>
</ul>
</section>
